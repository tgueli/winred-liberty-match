<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Liberty Match 1776</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* ==========================================================
   Liberty Match 1776 · Styles
   One deliberate look: Continental navy, Old Glory red, parchment, gilt.
   Type: Libre Caslon (the face of the 1776 Dunlap broadside) for titles,
   Atkinson Hyperlegible (built for low-vision readers) for everything else.
   ========================================================== */
:root {
  --navy: #1c2b4b;
  --navy-2: #26395f;
  --navy-3: #33497a;
  --navy-deep: #111b31;
  --red: #b22234;
  --red-2: #8f1a29;
  --red-hi: #cf3346;
  --parch: #f2e6c8;
  --parch-2: #e8d7ad;
  --parch-3: #d8c08a;
  --vellum: #fbf5e6;
  --gilt: #c8962e;
  --gilt-hi: #ecc766;
  --gilt-lo: #86611a;
  --ink: #2b2118;
  --ink-2: #5b4a37;
  --ink-3: #7d6a52;
  --green: #2e7d4f;
  --green-2: #226140;
  --white: #fffdf7;
  --ui: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --gutter: 16px;
  --radius: 14px;
}

html { height: 100%; box-sizing: border-box; font-size: 20px; -webkit-text-size-adjust: 100%; }
html.t-larger { font-size: 22px; }
html.t-largest { font-size: 24px; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family: var(--ui);
  font-size: 1rem;
  line-height: 1.45;
  color: var(--ink);
  background:
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .06) 0 1.2px, transparent 1.6px) 0 0 / 26px 26px,
    var(--navy-deep);
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
svg { display: block; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--gilt-hi); outline-offset: 3px; }

#app {
  position: relative;
  height: 100%;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--parch);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 0 60px rgba(0, 0, 0, .5);
  user-select: none;
  -webkit-user-select: none;
}
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.parchment {
  background:
    radial-gradient(ellipse at 50% -10%, rgba(255, 252, 240, .75), transparent 60%),
    radial-gradient(ellipse at 110% 110%, rgba(134, 97, 26, .22), transparent 55%),
    radial-gradient(ellipse at -10% 90%, rgba(134, 97, 26, .16), transparent 50%),
    var(--parch);
}
[hidden] { display: none !important; }
.pill span svg, .goal-moves svg { display: inline-block; width: 1.3rem; height: 1.3rem; vertical-align: -0.28rem; }
.sb-star svg, .hand svg, .fly-coin svg { width: 100%; height: 100%; }
.flag-box svg { width: 100%; height: auto; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Buttons ---------- */
.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .5rem;
  min-height: 3rem;
  padding: .6rem 1.2rem;
  border: 0;
  border-radius: 12px;
  font-family: var(--ui);
  font-weight: 700;
  font-size: 1.05rem;
  line-height: 1.15;
  text-align: center;
  cursor: pointer;
  touch-action: manipulation;
  transition: transform .08s ease, filter .15s ease;
}
.btn:active { transform: translateY(2px); }
.btn:disabled { filter: grayscale(.7) brightness(.9); cursor: default; }
.btn svg { width: 1.4em; height: 1.4em; flex: none; }
.btn-wide { width: 100%; }
.btn-xl { min-height: 3.5rem; font-size: 1.2rem; }
.btn-red, .btn-navy, .btn-green {
  color: var(--white);
  text-shadow: 0 1px 0 rgba(0, 0, 0, .35);
}
.btn-red::before, .btn-navy::before, .btn-green::before {
  content: "";
  position: absolute;
  inset: 5px;
  border: 1.5px dashed rgba(255, 238, 205, .55);
  border-radius: 8px;
  pointer-events: none;
}
.btn-red { background: linear-gradient(#c92b3f, #a41d30); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 #6b1220; }
.btn-navy { background: linear-gradient(#304777, #1f3058); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .25), 0 3px 0 #0e1628; }
.btn-green { background: linear-gradient(#36915c, #276d45); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 #173f28; }
.btn-ghost {
  background: var(--vellum);
  color: var(--navy);
  box-shadow: inset 0 0 0 2px var(--navy-3), 0 2px 0 rgba(28, 43, 75, .25);
}
.btn-text {
  min-height: 2.6rem;
  background: none;
  color: var(--navy);
  text-decoration: underline;
  text-underline-offset: 4px;
  font-weight: 700;
}

/* ---------- Title screen: a 1776 broadside ---------- */
#scr-title { align-items: center; overflow-y: auto; }
.bunting { width: 100%; height: auto; flex: none; }
.broadside {
  width: 100%;
  padding: .4rem var(--gutter) 1.4rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .5rem;
  text-align: center;
}
.bs-small { font-family: var(--serif); font-size: .82rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
.bs-rule { width: 78%; height: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--ink); padding-top: 3px; }
.bs-mid { font-family: var(--serif); font-style: italic; font-size: 1.05rem; color: var(--ink-2); }
.bs-states { font-family: var(--serif); font-weight: 700; font-size: .95rem; letter-spacing: .08em; text-transform: uppercase; }
.bs-title {
  font-family: var(--display);
  font-weight: 400;
  font-size: 3.7rem;
  line-height: .9;
  letter-spacing: .02em;
  color: var(--navy);
  text-shadow: 0 2px 0 rgba(255, 255, 255, .6);
}
.bs-title .red { color: var(--red); }
.bs-year {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-family: var(--display);
  font-size: 1.6rem;
  color: var(--red);
  letter-spacing: .1em;
}
.bs-year svg { width: 1rem; height: 1rem; color: var(--gilt); }
.title-flag { width: min(64%, 280px); filter: drop-shadow(0 6px 10px rgba(43, 33, 24, .3)); }
.title-flag svg { width: 100%; height: auto; }
.bs-progress { font-weight: 700; color: var(--ink-2); font-size: .9rem; }
.seal-btn {
  position: relative;
  width: 8.6rem;
  height: 8.6rem;
  border: 0;
  padding: 0;
  background: none;
  cursor: pointer;
  touch-action: manipulation;
  filter: drop-shadow(0 5px 6px rgba(80, 10, 10, .45));
  transition: transform .1s ease;
}
.seal-btn:active { transform: scale(.96); }
.seal-btn svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.seal-btn span {
  position: relative;
  font-family: var(--display);
  font-size: 1.75rem;
  letter-spacing: .08em;
  color: #fff3dc;
  text-shadow: 0 2px 0 #5e0f16;
}
.bs-note { font-size: .78rem; color: var(--ink-3); max-width: 22rem; }

/* ---------- Top bar ---------- */
.topbar {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .5rem;
  padding: .55rem var(--gutter);
  background: linear-gradient(var(--navy-2), var(--navy));
  border-bottom: 3px solid var(--gilt);
  color: var(--white);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  min-height: 2.6rem;
  padding: .2rem .8rem .2rem .3rem;
  border: 2px solid var(--gilt);
  border-radius: 999px;
  background: var(--navy-deep);
  color: var(--white);
  font-weight: 700;
  font-size: 1.05rem;
  cursor: pointer;
  touch-action: manipulation;
  font-variant-numeric: tabular-nums;
}
.pill > svg { width: 2rem; height: 2rem; }
.pill .sub { font-size: .75rem; font-weight: 700; color: var(--gilt-hi); margin-left: .1rem; }
.pill .plus {
  display: grid;
  place-items: center;
  width: 1.6rem;
  height: 1.6rem;
  margin-left: .2rem;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
}
.pill .plus svg { width: 1rem; height: 1rem; }
.heart-ico { color: #e2394f; }

/* ---------- Tab bar ---------- */
.views { position: relative; flex: 1; min-height: 0; }
.view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.tabbar {
  flex: none;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--navy);
  border-top: 3px solid var(--gilt);
}
.tab {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .1rem;
  padding: .45rem 0 .5rem;
  border: 0;
  background: none;
  color: #c9d2e8;
  font-size: .8rem;
  font-weight: 700;
  cursor: pointer;
  touch-action: manipulation;
}
.tab svg { width: 1.6rem; height: 1.6rem; }
.tab[aria-current="page"] { color: #fff; background: linear-gradient(rgba(178, 34, 52, .0), rgba(178, 34, 52, .45)); }
.tab[aria-current="page"]::before {
  content: "";
  position: absolute;
  top: -3px;
  left: 20%;
  right: 20%;
  height: 5px;
  border-radius: 0 0 4px 4px;
  background: var(--red-hi);
}
.tab .dot {
  position: absolute;
  top: .35rem;
  left: calc(50% + .55rem);
  width: .65rem;
  height: .65rem;
  border-radius: 50%;
  background: var(--red-hi);
  box-shadow: 0 0 0 2px var(--navy);
}

/* ---------- Shared page pieces ---------- */
.page { padding: 1rem var(--gutter) 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.page-head h2 { font-family: var(--serif); font-weight: 700; font-size: 1.45rem; color: var(--navy); line-height: 1.15; }
.page-head p { color: var(--ink-2); font-size: .92rem; margin-top: .2rem; }
.eyebrow { font-family: var(--serif); font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
.section-title {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.12rem;
  color: var(--navy);
}
.section-title::after { content: ""; flex: 1; height: 0; border-top: 1.5px solid var(--parch-3); }
.card {
  background: var(--vellum);
  border-radius: var(--radius);
  box-shadow: 0 0 0 1.5px var(--parch-3), 0 3px 8px rgba(91, 74, 55, .12);
}

/* ---------- Map ---------- */
.map-head {
  display: grid;
  grid-template-columns: 7.2rem 1fr;
  align-items: center;
  gap: .9rem;
  padding: .9rem;
}
.map-head .flag svg { width: 100%; height: auto; border-radius: 3px; box-shadow: 0 2px 6px rgba(0, 0, 0, .25); }
.map-head h2 { font-family: var(--serif); font-weight: 700; font-size: 1.2rem; color: var(--navy); line-height: 1.15; }
.map-head p { font-size: .88rem; color: var(--ink-2); margin-top: .25rem; }
.gift-banner {
  display: flex;
  align-items: center;
  gap: .75rem;
  width: 100%;
  padding: .65rem .8rem;
  border: 0;
  border-radius: var(--radius);
  background: linear-gradient(100deg, var(--navy-2), var(--navy));
  color: #fff;
  text-align: left;
  cursor: pointer;
  box-shadow: 0 0 0 2px var(--gilt);
}
.gift-banner svg { width: 2.6rem; height: 2.6rem; flex: none; color: var(--gilt-hi); }
.gift-banner b { display: block; font-size: 1.02rem; }
.gift-banner span { font-size: .85rem; color: #d6ddee; }
.gift-banner .go { margin-left: auto; padding: .35rem .8rem; border-radius: 999px; background: var(--red); font-weight: 700; font-size: .9rem; color: #fff; }

.road { position: relative; display: flex; flex-direction: column; gap: 1.6rem; padding: .6rem 0 1rem; }
.road-line { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.stop {
  position: relative;
  display: grid;
  grid-template-columns: 4.4rem 1fr;
  align-items: center;
  gap: .8rem;
  width: 100%;
  padding: 0;
  border: 0;
  background: none;
  text-align: left;
  cursor: pointer;
  touch-action: manipulation;
  z-index: 1;
}
.stop.flip { grid-template-columns: 1fr 4.4rem; text-align: right; }
.stop.flip .node { order: 2; }
.node {
  position: relative;
  display: grid;
  place-items: center;
  width: 4.4rem;
  height: 4.4rem;
  border-radius: 50%;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.6rem;
  color: #fff;
  background: radial-gradient(circle at 35% 30%, #3c5690, var(--navy));
  box-shadow: 0 0 0 4px var(--gilt), 0 0 0 7px var(--vellum), 0 5px 10px rgba(0, 0, 0, .3);
}
.node .node-stars {
  position: absolute;
  bottom: -.55rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 1px;
  padding: .1rem .3rem;
  border-radius: 999px;
  background: var(--vellum);
  box-shadow: 0 0 0 1.5px var(--gilt);
}
.node-stars svg { width: .85rem; height: .85rem; }
.stop.current .node { background: radial-gradient(circle at 35% 30%, #e0485b, var(--red)); }
.stop.current .node::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 3px solid var(--red-hi);
  animation: ping 1.6s ease-out infinite;
}
.stop.locked .node { background: radial-gradient(circle at 35% 30%, #e6d6ae, #cdb683); color: #8e7a58; box-shadow: 0 0 0 4px #b9a274, 0 0 0 7px var(--vellum); }
.stop.locked .node svg { width: 1.7rem; height: 1.7rem; }
.stop-label { display: flex; flex-direction: column; gap: .1rem; padding: .55rem .75rem; border-radius: 12px; background: rgba(251, 245, 230, .92); box-shadow: 0 0 0 1.5px var(--parch-3); }
.stop-label .t { font-family: var(--serif); font-weight: 700; font-size: 1.02rem; line-height: 1.2; color: var(--navy); }
.stop-label .d { font-family: var(--serif); font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stop-label .s { font-size: .82rem; font-weight: 700; color: var(--red); }
.stop.locked .stop-label { opacity: .72; }
.stop.locked .stop-label .t { color: var(--ink-2); }
@keyframes ping { 0% { transform: scale(.85); opacity: .9; } 100% { transform: scale(1.18); opacity: 0; } }

.coming { padding: 1rem; text-align: center; display: flex; flex-direction: column; gap: .35rem; align-items: center; }
.coming h3 { font-family: var(--serif); font-size: 1.1rem; color: var(--navy); }
.coming p { font-size: .9rem; color: var(--ink-2); }
.map-cta {
  position: sticky;
  bottom: 0;
  z-index: 2;
  padding: .75rem var(--gutter) .85rem;
  margin: 0 calc(var(--gutter) * -1) -1.5rem;
  background: linear-gradient(rgba(242, 230, 200, 0), var(--parch) 35%);
}
.map-cta .btn { width: 100%; }
.map-cta .btn small { display: block; font-size: .8rem; font-weight: 400; opacity: .92; }

/* ---------- Store ---------- */
.offer {
  position: relative;
  overflow: hidden;
  padding: 1rem;
  border-radius: var(--radius);
  color: #fff;
  background:
    repeating-linear-gradient(180deg, rgba(255, 255, 255, .05) 0 12px, transparent 12px 24px),
    linear-gradient(160deg, var(--navy-3), var(--navy));
  box-shadow: 0 0 0 2.5px var(--gilt), 0 6px 14px rgba(28, 43, 75, .35);
  display: flex;
  flex-direction: column;
  gap: .6rem;
}
.offer .ribbon {
  align-self: flex-start;
  padding: .2rem .9rem .2rem .7rem;
  background: var(--red);
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  clip-path: polygon(0 0, 100% 0, 92% 50%, 100% 100%, 0 100%);
}
.offer h3 { font-family: var(--serif); font-size: 1.35rem; line-height: 1.15; }
.offer ul { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: .35rem .8rem; }
.offer li { display: flex; align-items: center; gap: .4rem; font-size: .9rem; }
.offer li svg { width: 1.6rem; height: 1.6rem; flex: none; }
.pack-list { display: flex; flex-direction: column; gap: .6rem; }
.pack {
  display: grid;
  grid-template-columns: 3.2rem 1fr auto;
  align-items: center;
  gap: .7rem;
  padding: .6rem .75rem;
}
.pack-art svg { width: 3.2rem; height: 3.2rem; }
.pack-name { font-weight: 700; font-size: .95rem; color: var(--ink-2); }
.pack-amt { display: flex; align-items: center; gap: .3rem; font-weight: 700; font-size: 1.3rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.pack-amt svg { width: 1.3rem; height: 1.3rem; }
.tag { white-space: nowrap; display: inline-block; margin-top: .15rem; padding: .05rem .5rem; border-radius: 999px; font-size: .72rem; font-weight: 700; letter-spacing: .04em; background: var(--red); color: #fff; }
.tag.gold { background: var(--gilt); color: var(--navy-deep); }
.pack .btn { min-width: 5.4rem; min-height: 2.8rem; padding: .5rem .8rem; }
.coin-price { display: inline-flex; align-items: center; gap: .3rem; }
.coin-price svg { width: 1.2em; height: 1.2em; }
.pass {
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: .6rem;
  border-radius: var(--radius);
  background: linear-gradient(160deg, #fff7df, #f1dba0);
  box-shadow: 0 0 0 2.5px var(--gilt), 0 4px 10px rgba(134, 97, 26, .25);
}
.pass-head { display: flex; align-items: center; gap: .7rem; }
.pass-head svg { width: 3rem; height: 3rem; flex: none; }
.pass-head h3 { font-family: var(--serif); font-size: 1.25rem; color: var(--navy); }
.pass-head p { font-size: .88rem; color: var(--ink-2); }
.checks { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .3rem; }
.checks li { display: flex; gap: .5rem; align-items: flex-start; font-size: .95rem; }
.checks li svg { width: 1.2rem; height: 1.2rem; flex: none; margin-top: .15rem; color: var(--green); }
.store-foot { display: flex; flex-direction: column; align-items: center; gap: .4rem; text-align: center; font-size: .82rem; color: var(--ink-3); }
.demo-badge {
  display: inline-block;
  padding: .1rem .5rem;
  border-radius: 6px;
  background: var(--navy);
  color: var(--gilt-hi);
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: .1em;
}

/* ---------- History book ---------- */
.hcard { padding: 1rem; display: flex; flex-direction: column; gap: .55rem; }
.hcard h3 { font-family: var(--serif); font-size: 1.2rem; color: var(--navy); line-height: 1.2; }
.hcard .fact { font-size: .98rem; line-height: 1.5; }
.hcard blockquote {
  margin: 0;
  padding: .55rem .8rem;
  border-left: 4px solid var(--red);
  background: rgba(232, 215, 173, .45);
  border-radius: 0 10px 10px 0;
  font-family: var(--serif);
  font-style: italic;
  font-size: 1rem;
  line-height: 1.4;
}
.hcard cite { display: block; margin-top: .3rem; font-family: var(--ui); font-style: normal; font-size: .8rem; color: var(--ink-2); }
.hcard.locked { flex-direction: row; align-items: center; gap: .8rem; background: rgba(251, 245, 230, .55); box-shadow: 0 0 0 1.5px dashed var(--parch-3); }
.hcard.locked svg { width: 1.6rem; height: 1.6rem; color: var(--ink-3); flex: none; }
.hcard.locked b { font-family: var(--serif); color: var(--ink-2); }
.hcard.locked span { font-size: .85rem; color: var(--ink-3); }
.read-btn { align-self: flex-start; min-height: 2.6rem; font-size: .92rem; padding: .4rem .9rem; }

/* ---------- Settings ---------- */
.setting { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .85rem 1rem; }
.setting + .setting { border-top: 1.5px solid var(--parch-2); }
.setting-label b { display: block; font-size: 1rem; }
.setting-label span { display: block; font-size: .82rem; color: var(--ink-2); }
.setting.stack { flex-direction: column; align-items: stretch; gap: .55rem; }
.switch {
  position: relative;
  flex: none;
  width: 3.5rem;
  height: 2rem;
  border: 0;
  border-radius: 999px;
  background: #b9ab8c;
  cursor: pointer;
  transition: background .2s;
}
.switch::after {
  content: "";
  position: absolute;
  top: .2rem;
  left: .2rem;
  width: 1.6rem;
  height: 1.6rem;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 3px rgba(0, 0, 0, .3);
  transition: transform .2s;
}
.switch[aria-checked="true"] { background: var(--green); }
.switch[aria-checked="true"]::after { transform: translateX(1.5rem); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--parch-2); }
.seg button {
  min-height: 2.6rem;
  border: 0;
  border-radius: 9px;
  background: none;
  font-weight: 700;
  font-size: .92rem;
  color: var(--ink-2);
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; box-shadow: 0 2px 0 rgba(0, 0, 0, .25); }
.ledger { font-size: .85rem; color: var(--ink-2); display: flex; flex-direction: column; gap: .25rem; }
.ledger div { display: flex; justify-content: space-between; gap: .5rem; }

/* ---------- Game screen ---------- */
#scr-game {
  background:
    radial-gradient(ellipse at 50% 35%, rgba(60, 86, 144, .55), transparent 70%),
    radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .07) 0 1px, transparent 1.5px) 0 0 / 22px 22px,
    var(--navy);
  color: #fff;
}
.gtop {
  flex: none;
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: .6rem;
  padding: .5rem var(--gutter) .3rem;
}
.gbtn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  min-height: 2.6rem;
  padding: .25rem .8rem .25rem .6rem;
  border: 2px solid var(--gilt);
  border-radius: 999px;
  background: var(--navy-deep);
  color: #fff;
  font-weight: 700;
  font-size: .92rem;
  cursor: pointer;
}
.gbtn svg { width: 1.3rem; height: 1.3rem; }
.gtitle { min-width: 0; text-align: right; line-height: 1.15; }
.gtitle .lv { display: block; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gilt-hi); }
.gtitle .nm { display: block; font-family: var(--serif); font-weight: 700; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud {
  flex: none;
  display: grid;
  grid-template-columns: 5.4rem 1fr;
  gap: .6rem;
  padding: .3rem var(--gutter) .4rem;
}
.hud-box {
  border-radius: 12px;
  background: linear-gradient(#fdf8ea, #efe1bd);
  color: var(--ink);
  box-shadow: 0 0 0 2.5px var(--gilt), inset 0 -3px 0 rgba(134, 97, 26, .18);
}
.moves { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .25rem 0; }
.moves .lbl, .goals-lbl { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.moves .val { font-size: 2rem; font-weight: 700; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.moves.low .val { color: var(--red); animation: throb 1s ease-in-out infinite; }
@keyframes throb { 50% { transform: scale(1.12); } }
.goals-box { display: flex; flex-direction: column; justify-content: center; padding: .3rem .6rem; gap: .15rem; }
.goals { display: flex; flex-wrap: wrap; gap: .35rem .8rem; align-items: center; }
.goal { display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; font-size: 1.35rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.goal .gi { position: relative; width: 2.3rem; height: 2.3rem; }
.goal .gi svg { width: 100%; height: 100%; }
.goal.done { color: var(--green); }
.goal .ck { display: none; width: 1.5rem; height: 1.5rem; color: #fff; background: var(--green); border-radius: 50%; padding: .2rem; }
.goal.done .n { display: none; }
.goal.done .ck { display: block; }
.goal.bump .gi { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.3); } }
.scorebar { flex: none; padding: 0 var(--gutter) .35rem; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .6rem; }
.sb-track { position: relative; height: .75rem; border-radius: 999px; background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1.5px rgba(200, 150, 46, .6); }
.sb-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--gilt), var(--gilt-hi)); transition: width .4s ease; }
.sb-star { position: absolute; top: 50%; width: 1.25rem; height: 1.25rem; transform: translate(-50%, -50%); color: rgba(255, 255, 255, .35); }
.sb-star.on { color: var(--gilt-hi); filter: drop-shadow(0 0 4px rgba(236, 199, 102, .9)); }
.score-num { font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: right; color: #f4e7c5; }

.board-wrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: start center; align-content: start; padding: .45rem var(--gutter) .3rem; }
.board {
  position: relative;
  border-radius: 12px;
  background: #f5ead0;
  box-shadow: 0 0 0 4px var(--gilt), 0 0 0 7px #5e440f, 0 12px 26px rgba(0, 0, 0, .5);
  touch-action: none;
  overflow: hidden;
}
.board.shake { animation: shake .32s ease; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, -1px); } }
.tiles, .pieces, .fx { position: absolute; inset: 0; }
.fx { pointer-events: none; z-index: 3; }
.pieces { z-index: 2; }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); background: #f6ecd3; }
.tile.alt { background: #eadcb6; }
.tile.seal1, .tile.seal2 { background: #c0392f; box-shadow: inset 0 0 0 2px #7d1b16, inset 0 0 0 5px #d95a4f; }
.tile.seal2 { background: #8e211b; box-shadow: inset 0 0 0 2px #4e0f0b, inset 0 0 0 5px var(--gilt); }
.tile svg { position: absolute; inset: 14%; width: 72%; height: 72%; opacity: .45; }
.tile.crack { animation: crack .45s ease; }
@keyframes crack { 30% { filter: brightness(1.8); transform: scale(.92); } }
.pc { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); will-change: transform; }
.pc::before {
  content: "";
  position: absolute;
  left: 18%;
  right: 18%;
  bottom: 6%;
  height: 14%;
  border-radius: 50%;
  background: radial-gradient(rgba(60, 40, 10, .35), transparent 70%);
}
.pc .ic { position: absolute; left: 7%; top: 6%; width: 86%; height: 86%; transition: transform .15s ease; }
.pc .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pc.sp-col .ov { transform: rotate(90deg); }
.pc.sp-row .ic, .pc.sp-col .ic, .pc.sp-keg .ic { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 5px rgba(255, 207, 63, .95)); } }
.pc .rays {
  position: absolute;
  inset: -8%;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(255, 214, 90, .85) 0 9deg, rgba(255, 214, 90, 0) 9deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%);
  mask: radial-gradient(circle, #000 30%, transparent 70%);
  animation: spin 5s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pc.drop .badge {
  position: absolute;
  right: 2%;
  bottom: 2%;
  width: 34%;
  height: 34%;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 2px #fff;
  color: #fff;
  animation: nudge 1.2s ease-in-out infinite;
}
.pc.drop .badge svg { width: 100%; height: 100%; }
@keyframes nudge { 50% { transform: translateY(12%); } }
.pc.sel .ic { transform: scale(1.12); }
.pc.sel::after {
  content: "";
  position: absolute;
  inset: 2%;
  border-radius: 24%;
  border: 4px solid #ffcf3f;
  box-shadow: 0 0 12px rgba(255, 207, 63, .9), inset 0 0 8px rgba(255, 207, 63, .6);
}
.pc.hint .ic { animation: wiggle .9s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-11deg) scale(1.1); } 75% { transform: rotate(11deg) scale(1.1); } }
.pc.pop .ic { animation: pop .26s ease-in forwards; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
.pc.pop::before { opacity: 0; }
.pc.made .ic { animation: made .5s ease-out; }
@keyframes made { 0% { transform: scale(.4) rotate(-30deg); } 60% { transform: scale(1.3) rotate(6deg); } 100% { transform: scale(1); } }
.pc.hit .ic { animation: hit .3s ease; }
@keyframes hit { 25% { transform: translateX(-8%) rotate(-5deg); } 75% { transform: translateX(8%) rotate(5deg); } }
.pc.deliver .ic { animation: deliver .55s ease-in forwards; }
@keyframes deliver { 30% { transform: translateY(-12%) scale(1.15); } 100% { transform: translateY(90%) scale(.4); opacity: 0; } }
.pc.nope .ic { animation: hit .3s ease; }
.board.tut .pc:not(.tut-on) { opacity: .3; }
.board.tut .pc.tut-on::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 24%;
  border: 4px solid #fff;
  box-shadow: 0 0 14px #fff;
  animation: ping2 1.2s ease-in-out infinite;
}
@keyframes ping2 { 50% { transform: scale(1.08); } }
.hand {
  position: absolute;
  left: 0;
  top: 0;
  z-index: 5;
  width: calc(var(--cell) * .9);
  height: calc(var(--cell) * .9);
  pointer-events: none;
  filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .4));
  animation: handmove 1.8s ease-in-out infinite;
}
@keyframes handmove { 0%, 15% { transform: translate(var(--hx0), var(--hy0)) scale(1); } 25% { transform: translate(var(--hx0), var(--hy0)) scale(.85); } 60%, 70% { transform: translate(var(--hx1), var(--hy1)) scale(.85); } 85%, 100% { transform: translate(var(--hx1), var(--hy1)) scale(1); opacity: 0; } }

/* Effects */
.beam { position: absolute; border-radius: 999px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 20%, #ffe28a 50%, #fff 80%, rgba(255, 255, 255, 0)); box-shadow: 0 0 16px #ffd34d, 0 0 30px rgba(255, 150, 40, .7); }
.beam.h { height: 34%; animation: beamh .42s ease-out forwards; }
.beam.v { width: 34%; background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 20%, #ffe28a 50%, #fff 80%, rgba(255, 255, 255, 0)); animation: beamv .42s ease-out forwards; }
.beam.cannon { box-shadow: 0 0 16px #ff8a3d, 0 0 34px rgba(210, 40, 40, .8); }
@keyframes beamh { 0% { transform: scaleX(.05); opacity: 1; } 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1) scaleY(.2); opacity: 0; } }
@keyframes beamv { 0% { transform: scaleY(.05); opacity: 1; } 55% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1) scaleX(.2); opacity: 0; } }
.blast { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff 0 15%, #ffe28a 30%, #ff9a3d 55%, rgba(210, 50, 40, 0) 72%); animation: blast .5s ease-out forwards; }
@keyframes blast { 0% { transform: scale(.2); opacity: 1; } 70% { opacity: .95; } 100% { transform: scale(1.15); opacity: 0; } }
.flash { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 226, 138, .6) 45%, rgba(255, 226, 138, 0) 70%); animation: flash .45s ease-out forwards; }
@keyframes flash { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
.bell-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.bell-lines line { stroke: #ffd34d; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px #fff); animation: zap .5s ease-out forwards; }
@keyframes zap { 0% { opacity: 1; stroke-dasharray: 0 400; } 50% { stroke-dasharray: 400 0; opacity: 1; } 100% { opacity: 0; } }
.pts {
  position: absolute;
  z-index: 6;
  transform: translate(-50%, -50%);
  font-weight: 700;
  font-size: 1.15rem;
  color: #fff;
  white-space: nowrap;
  text-shadow: 0 0 3px var(--navy), 0 2px 0 var(--navy), 2px 0 0 var(--navy), -2px 0 0 var(--navy), 0 -2px 0 var(--navy);
  animation: rise .9s ease-out forwards;
}
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.spark { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: spark .8s ease-out forwards; }
@keyframes spark { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }

.banner {
  position: absolute;
  left: 50%;
  top: 50%;
  z-index: 8;
  transform: translate(-50%, -50%);
  width: max-content;
  max-width: calc(100% - 2 * var(--gutter));
  padding: .7rem 1.4rem;
  border-radius: 14px;
  background: var(--red);
  color: #fff;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 1.5rem;
  text-align: center;
  box-shadow: 0 0 0 3px var(--gilt), 0 10px 24px rgba(0, 0, 0, .45);
  pointer-events: none;
  animation: bannerIn .35s cubic-bezier(.2, 1.4, .5, 1);
}
.banner small { display: block; font-family: var(--ui); font-weight: 400; font-size: .85rem; }
@keyframes bannerIn { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }
.skip-note { position: absolute; bottom: .4rem; left: 0; right: 0; z-index: 8; text-align: center; font-size: .85rem; color: #fff; text-shadow: 0 1px 2px #000; pointer-events: none; }

.boosters { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; padding: .45rem var(--gutter) .7rem; }
.booster {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: .05rem;
  padding: .35rem .2rem .4rem;
  border: 0;
  border-radius: 14px;
  background: linear-gradient(#fdf8ea, #eadbb4);
  color: var(--ink);
  box-shadow: 0 0 0 2.5px var(--gilt), 0 3px 0 #5e440f;
  cursor: pointer;
  touch-action: manipulation;
}
.booster:active { transform: translateY(2px); }
.booster svg { width: 2.4rem; height: 2.4rem; }
.booster .bname { font-weight: 700; font-size: .85rem; }
.booster .bcount {
  position: absolute;
  top: -.45rem;
  right: -.3rem;
  min-width: 1.6rem;
  height: 1.6rem;
  padding: 0 .35rem;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: var(--navy);
  color: #fff;
  font-size: .85rem;
  font-weight: 700;
  box-shadow: 0 0 0 2px #fff;
}
.booster .bcount.buy { background: var(--green); }
.booster.armed { background: linear-gradient(#fff2c2, #f3cf63); box-shadow: 0 0 0 3px #fff, 0 0 18px #ffd34d; }
.booster:disabled { opacity: .55; }
.bubble {
  position: absolute;
  left: var(--gutter);
  right: var(--gutter);
  bottom: .6rem;
  z-index: 9;
  display: grid;
  grid-template-columns: 3.4rem 1fr;
  gap: .7rem;
  align-items: start;
  padding: .75rem .85rem;
  border-radius: 16px;
  background: var(--vellum);
  color: var(--ink);
  box-shadow: 0 0 0 3px var(--gilt), 0 10px 24px rgba(0, 0, 0, .45);
  animation: bubbleIn .35s cubic-bezier(.2, 1.3, .5, 1);
}
.bubble.top { bottom: auto; top: .4rem; }
.bubble svg.crier { width: 3.4rem; height: 3.4rem; }
.bubble b { display: block; font-family: var(--serif); color: var(--red); font-size: 1rem; }
.bubble p { font-size: .98rem; line-height: 1.4; }
.bubble .btn { margin-top: .5rem; min-height: 2.6rem; padding: .4rem 1rem; font-size: .95rem; }
.bubble .row { display: flex; gap: .5rem; flex-wrap: wrap; }
@keyframes bubbleIn { from { transform: translateY(20px); opacity: 0; } }
.bubble.nudge { animation: hit .35s ease; }
.bubble.mini { grid-template-columns: 1fr auto; align-items: center; gap: .6rem; padding: .5rem .55rem .5rem .9rem; }
.bubble.mini p { font-weight: 700; font-size: .95rem; line-height: 1.3; }
.bubble.mini .btn { margin-top: 0; }

/* ---------- Modals ---------- */
#modal-root { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.backdrop {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: var(--gutter);
  background: rgba(10, 16, 30, .62);
  pointer-events: auto;
  animation: fadeIn .2s ease;
}
.backdrop.sheet { place-items: end stretch; padding: 0; }
@keyframes fadeIn { from { opacity: 0; } }
.modal {
  position: relative;
  width: 100%;
  max-height: 100%;
  overflow-y: auto;
  padding: 1.3rem 1.1rem 1.1rem;
  border-radius: 18px;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(255, 252, 240, .9), transparent 60%),
    var(--parch);
  box-shadow: 0 0 0 3px var(--gilt), 0 0 0 6px var(--navy), 0 18px 40px rgba(0, 0, 0, .5);
  display: flex;
  flex-direction: column;
  gap: .85rem;
  text-align: center;
  animation: popIn .3s cubic-bezier(.2, 1.3, .5, 1);
}
.sheet .modal { border-radius: 20px 20px 0 0; box-shadow: 0 0 0 3px var(--gilt), 0 -10px 30px rgba(0, 0, 0, .45); animation: slideUp .3s ease; max-height: 92%; }
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
@keyframes slideUp { from { transform: translateY(100%); } }
.modal .ribbon-h {
  align-self: center;
  margin-top: -.2rem;
  padding: .3rem 1.6rem;
  background: var(--red);
  color: #fff;
  font-weight: 700;
  font-size: .85rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%);
}
.modal h2 { font-family: var(--serif); font-weight: 700; font-size: 1.55rem; line-height: 1.15; color: var(--navy); }
.modal h2.display { font-family: var(--display); font-weight: 400; font-size: 2.1rem; }
.modal .date { font-family: var(--serif); font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); margin-top: -.5rem; }
.modal .lead { font-size: 1rem; line-height: 1.5; color: var(--ink); text-align: left; }
.modal .actions { display: flex; flex-direction: column; gap: .6rem; margin-top: .2rem; }
.modal > .actions:last-child {
  position: sticky;
  bottom: -1.1rem;
  z-index: 2;
  margin: .2rem -1.1rem -1.1rem;
  padding: .7rem 1.1rem 1.1rem;
  background: linear-gradient(rgba(242, 230, 200, 0), var(--parch) 1rem);
}
.btn-stack { flex-direction: column; gap: .15rem; }
.btn-stack small { display: inline-flex; align-items: center; gap: .3rem; font-size: .9rem; }
.btn-stack small svg { width: 1.2rem; height: 1.2rem; }
.goal-panel { padding: .8rem; border-radius: 14px; background: var(--vellum); box-shadow: 0 0 0 2px var(--parch-3); display: flex; flex-direction: column; gap: .5rem; text-align: left; }
.goal-panel .eyebrow { text-align: center; }
.goal-line { display: flex; align-items: center; gap: .7rem; font-size: 1.05rem; font-weight: 700; }
.goal-line svg { width: 2.6rem; height: 2.6rem; flex: none; }
.goal-moves { text-align: center; font-size: .95rem; color: var(--ink-2); }
.stars-big { display: flex; justify-content: center; gap: .4rem; align-items: flex-end; }
.stars-big svg { width: 3.6rem; height: 3.6rem; color: #cdbb90; }
.stars-big svg:nth-child(2) { width: 4.4rem; height: 4.4rem; }
.stars-big svg.on { color: var(--gilt); filter: drop-shadow(0 0 6px rgba(236, 199, 102, .8)); animation: starIn .45s cubic-bezier(.2, 1.5, .5, 1) both; }
.stars-big svg.on:nth-child(2) { animation-delay: .25s; }
.stars-big svg.on:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
.reward-row { display: flex; justify-content: center; gap: .6rem; flex-wrap: wrap; }
.reward { display: inline-flex; align-items: center; gap: .35rem; padding: .35rem .8rem; border-radius: 999px; background: var(--navy); color: #fff; font-weight: 700; }
.reward svg { width: 1.4rem; height: 1.4rem; }
.big-ico { width: 5rem; height: 5rem; align-self: center; }
.remaining { display: flex; justify-content: center; flex-wrap: wrap; gap: .6rem 1rem; }
.remaining .goal { color: var(--navy); }
.coins-have { font-size: .9rem; color: var(--ink-2); display: inline-flex; align-items: center; gap: .3rem; justify-content: center; }
.coins-have svg { width: 1.2rem; height: 1.2rem; }
.checkout-item { display: grid; grid-template-columns: 3.4rem 1fr; gap: .8rem; align-items: center; text-align: left; padding: .7rem; border-radius: 14px; background: var(--vellum); box-shadow: 0 0 0 2px var(--parch-3); }
.checkout-item svg { width: 3.4rem; height: 3.4rem; }
.checkout-item b { display: block; font-size: 1.05rem; }
.checkout-item span { font-size: .88rem; color: var(--ink-2); }
.price-big { font-size: 2.2rem; font-weight: 700; color: var(--navy); font-variant-numeric: tabular-nums; }
.demo-note { padding: .55rem .7rem; border-radius: 10px; background: #fff3cd; box-shadow: 0 0 0 1.5px #e0c46c; font-size: .88rem; color: #5c4712; text-align: left; }
.spinner { width: 2.4rem; height: 2.4rem; align-self: center; border-radius: 50%; border: 4px solid var(--parch-3); border-top-color: var(--navy); animation: spin .8s linear infinite; }
.days { display: grid; grid-template-columns: repeat(4, 1fr); gap: .45rem; }
.day { position: relative; display: flex; flex-direction: column; align-items: center; gap: .1rem; padding: .45rem .2rem .4rem; border-radius: 12px; background: var(--vellum); box-shadow: 0 0 0 1.5px var(--parch-3); font-size: .78rem; font-weight: 700; color: var(--ink-2); }
.day svg { width: 2rem; height: 2rem; }
.day .amt { font-size: .82rem; color: var(--navy); }
.day.past { opacity: .55; }
.day.past::after { content: "\2713"; position: absolute; top: .1rem; right: .35rem; color: var(--green); font-size: 1rem; }
.day.today { background: #fff2c2; box-shadow: 0 0 0 3px var(--red); }
.day.d7 { grid-column: span 2; }
.video-box { aspect-ratio: 16 / 9; max-width: 100%; border-radius: 12px; background: var(--navy-deep); color: #fff; display: grid; place-items: center; padding: 1rem; font-size: .95rem; }
.video-box b { display: block; font-size: 2.4rem; font-variant-numeric: tabular-nums; }
.help-steps { display: flex; flex-direction: column; gap: .7rem; text-align: left; }
.help-step { display: grid; grid-template-columns: 3.4rem 1fr; gap: .75rem; align-items: center; }
.help-step .art { display: flex; justify-content: center; }
.help-step .art svg { width: 3rem; height: 3rem; }
.help-step .art.pair svg { width: 1.9rem; height: 1.9rem; }
.help-step p { font-size: .95rem; line-height: 1.4; }
.help-step b { color: var(--navy); }
.sp-demo { position: relative; width: 3rem; height: 3rem; }
.sp-demo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 60; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }

/* ---------- Toast ---------- */
.toast {
  position: absolute;
  left: 50%;
  bottom: 6rem;
  z-index: 70;
  transform: translateX(-50%);
  max-width: calc(100% - 2 * var(--gutter));
  padding: .7rem 1.1rem;
  border-radius: 12px;
  background: var(--navy-deep);
  color: #fff;
  font-weight: 700;
  font-size: .95rem;
  text-align: center;
  box-shadow: 0 0 0 2px var(--gilt), 0 8px 20px rgba(0, 0, 0, .4);
  animation: toastIn .3s ease;
  pointer-events: none;
}
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0; } }
.fly-coin { position: absolute; z-index: 80; width: 1.6rem; height: 1.6rem; pointer-events: none; transition: transform .7s cubic-bezier(.5, -0.3, .7, 1), opacity .7s; }

@media (max-height: 760px) {
  .broadside { gap: .4rem; padding-bottom: 1rem; }
  .bs-title { font-size: 3rem; }
  .bs-year { font-size: 1.35rem; }
  .title-flag { width: min(48%, 220px); }
  .seal-btn { width: 6.6rem; height: 6.6rem; }
  .seal-btn span { font-size: 1.45rem; }
}
@media (prefers-reduced-motion: reduce) {
  .stop.current .node::after, .pc .rays, .pc.hint .ic, .moves.low .val, .pc.sp-row .ic, .pc.sp-col .ic, .pc.sp-keg .ic, .pc.drop .badge { animation: none; }
  .board.shake { animation: none; }
  .confetti { display: none; }
}

<script>
/* ==========================================================
   Liberty Match 1776 · Game engine
   Pure game logic with no DOM access, so the same code runs in the
   browser and in the balancing simulator.
   ========================================================== */
(function (root) {
  'use strict';

  /* ---------- Seeded random numbers (mulberry32) ---------- */
  function RNG(seed) { this.s = (seed >>> 0) || 1; }
  RNG.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };
  RNG.prototype.clone = function () { const r = new RNG(1); r.s = this.s; return r; };

  /* ---------- Scoring ---------- */
  const PIECE_PTS = 20;
  const CREATE_BONUS = { row: 60, col: 60, keg: 90, bell: 150 };
  const FIRE_BONUS = { cross: 60, bigcross: 120, bigkeg: 120, all: 300 };
  const SEAL_PTS = 40, CRATE_HIT_PTS = 20, CRATE_BREAK_PTS = 60, DROP_PTS = 300, LEFTOVER_PTS = 100;

  /* A group of matched cells decides which special piece it makes */
  function decideSpecial(g) {
    let maxLen = 0, hasH = false, hasV = false;
    for (const r of g.runs) {
      if (r.cells.length > maxLen) maxLen = r.cells.length;
      if (r.dir === 'h') hasH = true; else hasV = true;
    }
    if (maxLen >= 5) return 'bell';
    if (hasH && hasV) return 'keg';
    if (maxLen === 4) {
      const r4 = g.runs.find(r => r.cells.length === 4);
      return r4.dir === 'h' ? 'row' : 'col';
    }
    return null;
  }

  /* ==========================================================
     Game
     ========================================================== */
  function Game(level, opts) {
    opts = opts || {};
    this.L = level;
    this.rows = level.rows || 7;
    this.cols = level.cols || 7;
    this.n = this.rows * this.cols;
    this.types = level.types || 5;
    this.record = opts.record !== false;
    this.rng = new RNG(opts.seed != null ? opts.seed : (Math.random() * 4294967296) >>> 0);
    this.nextId = 1;
    this.cells = new Array(this.n).fill(null);
    this.seals = new Array(this.n).fill(0);
    this.moves = level.moves;
    this.movesUsed = 0;
    this.score = 0;
    this.state = 'play';
    this.maxDrops = level.maxDrops || 1;
    this.goals = level.goals.map(g => Object.assign({}, g, { got: 0 }));
    this.stats = { made: { row: 0, col: 0, keg: 0, bell: 0 }, fired: {}, cascades: 0, shuffles: 0 };
    this._setup();
  }

  const G = Game.prototype;

  /* ---------- Board helpers ---------- */
  G.rc = function (i) { return [(i / this.cols) | 0, i % this.cols]; };
  G.idx = function (r, c) { return r * this.cols + c; };
  G.color = function (i) {
    const c = this.cells[i];
    return (c && c.k === 'p' && c.s !== 'bell') ? c.t : -1;
  };
  G._nbrs = function (i) {
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C, out = [];
    if (r > 0) out.push(i - C);
    if (r < R - 1) out.push(i + C);
    if (c > 0) out.push(i - 1);
    if (c < C - 1) out.push(i + 1);
    return out;
  };
  G.adjacent = function (a, b) {
    if (a < 0 || b < 0 || a >= this.n || b >= this.n) return false;
    const [ra, ca] = this.rc(a), [rb, cb] = this.rc(b);
    return Math.abs(ra - rb) + Math.abs(ca - cb) === 1;
  };
  G._center = function (cells) {
    let sr = 0, sc = 0;
    for (const i of cells) { const [r, c] = this.rc(i); sr += r; sc += c; }
    sr /= cells.length; sc /= cells.length;
    let best = cells[0], bd = 1e9;
    for (const i of cells) {
      const [r, c] = this.rc(i), d = (r - sr) * (r - sr) + (c - sc) * (c - sc);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };

  /* ---------- Setup ---------- */
  G._crate = function (hp) { return { id: this.nextId++, k: 'c', hp: hp }; };

  G._setup = function () {
    const L = this.L;
    if (L.layout) {
      for (let r = 0; r < this.rows; r++) {
        const line = L.layout[r] || '';
        for (let c = 0; c < this.cols; c++) {
          const ch = line[c] || '.', i = this.idx(r, c);
          if (ch === 's') this.seals[i] = 1;
          else if (ch === 'S') this.seals[i] = 2;
          else if (ch === 'c') this.cells[i] = this._crate(1);
          else if (ch === 'C') this.cells[i] = this._crate(2);
        }
      }
    }
    // Goals that count board features default to the number on the board
    for (const g of this.goals) {
      if (g.kind === 'seal' && !g.n) g.n = this.seals.reduce((a, b) => a + b, 0);
      if (g.kind === 'crate' && !g.n) g.n = this.cells.filter(c => c && c.k === 'c').length;
    }
    let tries = 0;
    do {
      this._fillFresh(L.preset);
      tries++;
    } while (!L.preset && tries < 300 && (this.findGroups().length || this.findMoves().length < 3));
    this._placeInitialDrops();
    if (!this.findMoves(1).length) this._shuffle(null);
  };

  G._fillFresh = function (preset) {
    const R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const i = this.idx(r, c), cur = this.cells[i];
        if (cur && cur.k === 'c') continue;
        let t;
        const ch = preset && preset[r] ? preset[r][c] : undefined;
        if (ch !== undefined && ch !== '.') t = +ch;
        else {
          let tries = 0;
          do { t = this.rng.int(this.types); tries++; }
          while (tries < 40 && (
            (c >= 2 && this.color(i - 1) === t && this.color(i - 2) === t) ||
            (r >= 2 && this.color(i - C) === t && this.color(i - 2 * C) === t)));
        }
        this.cells[i] = { id: this.nextId++, k: 'p', t: t, s: null };
      }
    }
  };

  G._dropGoal = function () { return this.goals.find(g => g.kind === 'drop'); };
  G.dropsOnBoard = function () {
    let n = 0;
    for (const c of this.cells) if (c && c.k === 'd') n++;
    return n;
  };

  G._placeInitialDrops = function () {
    const g = this._dropGoal();
    if (!g) return;
    const want = Math.min(this.maxDrops, g.n);
    const cols = [];
    for (let c = 1; c < this.cols - 1; c++) cols.push(c);
    for (let k = cols.length - 1; k > 0; k--) { const j = this.rng.int(k + 1); [cols[k], cols[j]] = [cols[j], cols[k]]; }
    const row = this.L.dropStartRow || 0;
    let placed = 0;
    for (const c of cols) {
      if (placed >= want) break;
      const i = this.idx(row, c), cur = this.cells[i];
      if (cur && cur.k === 'c') continue;
      this.cells[i] = { id: this.nextId++, k: 'd' };
      placed++;
    }
  };

  /* ---------- Match finding ---------- */
  G.findRuns = function () {
    const runs = [], R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      let c = 0;
      while (c < C) {
        const t = this.color(r * C + c);
        let e = c + 1;
        if (t >= 0) while (e < C && this.color(r * C + e) === t) e++;
        if (t >= 0 && e - c >= 3) {
          const cells = [];
          for (let k = c; k < e; k++) cells.push(r * C + k);
          runs.push({ dir: 'h', t: t, cells: cells });
        }
        c = e;
      }
    }
    for (let c = 0; c < C; c++) {
      let r = 0;
      while (r < R) {
        const t = this.color(r * C + c);
        let e = r + 1;
        if (t >= 0) while (e < R && this.color(e * C + c) === t) e++;
        if (t >= 0 && e - r >= 3) {
          const cells = [];
          for (let k = r; k < e; k++) cells.push(k * C + c);
          runs.push({ dir: 'v', t: t, cells: cells });
        }
        r = e;
      }
    }
    return runs;
  };

  G.findGroups = function () {
    const runs = this.findRuns();
    if (!runs.length) return [];
    const parent = runs.map((_, i) => i);
    const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const owner = new Map();
    runs.forEach((run, i) => run.cells.forEach(ci => {
      if (owner.has(ci)) {
        const a = find(owner.get(ci)), b = find(i);
        if (a !== b) parent[a] = b;
      } else owner.set(ci, i);
    }));
    const map = new Map();
    runs.forEach((run, i) => {
      const rt = find(i);
      let g = map.get(rt);
      if (!g) { g = { t: run.t, runs: [], cells: new Set() }; map.set(rt, g); }
      g.runs.push(run);
      run.cells.forEach(ci => g.cells.add(ci));
    });
    return Array.from(map.values());
  };

  G._placeCell = function (g, sp, prefer) {
    for (const p of prefer) if (g.cells.has(p)) return p;
    if (sp === 'keg') {
      const hCells = new Set();
      g.runs.forEach(r => { if (r.dir === 'h') r.cells.forEach(c => hCells.add(c)); });
      for (const r of g.runs) if (r.dir === 'v') for (const c of r.cells) if (hCells.has(c)) return c;
    }
    let best = g.runs[0];
    for (const r of g.runs) if (r.cells.length > best.cells.length) best = r;
    return best.cells[Math.floor((best.cells.length - 1) / 2)];
  };

  /* Length of the same-color line through cell i */
  G._lineAt = function (i) {
    const t = this.color(i);
    if (t < 0) return { h: 0, v: 0, t: t };
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C;
    let h = 1, v = 1;
    for (let k = c - 1; k >= 0 && this.color(r * C + k) === t; k--) h++;
    for (let k = c + 1; k < C && this.color(r * C + k) === t; k++) h++;
    for (let k = r - 1; k >= 0 && this.color(k * C + c) === t; k--) v++;
    for (let k = r + 1; k < R && this.color(k * C + c) === t; k++) v++;
    return { h: h, v: v, t: t };
  };

  /* ---------- Valid moves (for hints, bots and dead-board checks) ---------- */
  G.findMoves = function (limit) {
    const R = this.rows, C = this.cols, moves = [];
    for (let i = 0; i < this.n; i++) {
      const r = (i / C) | 0, c = i % C;
      if (c + 1 < C) this._checkMove(i, i + 1, moves);
      if (r + 1 < R) this._checkMove(i, i + C, moves);
      if (limit && moves.length >= limit) break;
    }
    return moves;
  };

  G._checkMove = function (a, b, moves) {
    const A = this.cells[a], B = this.cells[b];
    if (!A || !B || A.k === 'c' || B.k === 'c') return;
    const aSp = A.k === 'p' && A.s, bSp = B.k === 'p' && B.s;
    if (aSp || bSp) {
      // Move the special piece so it fires in the neighbour's spot
      if (aSp && !bSp) moves.push({ a: a, b: b, special: true });
      else if (bSp && !aSp) moves.push({ a: b, b: a, special: true });
      else moves.push({ a: a, b: b, special: true, combo: true });
      return;
    }
    if (A.k === 'd' && B.k === 'd') return;
    // A drop may always be swapped one row down, match or not
    if (A.k === 'd' && b === a + this.cols) { moves.push({ a: a, b: b, drop: true }); return; }
    this.cells[a] = B; this.cells[b] = A;
    const la = this._lineAt(a), lb = this._lineAt(b);
    this.cells[a] = A; this.cells[b] = B;
    if (la.h >= 3 || la.v >= 3 || lb.h >= 3 || lb.v >= 3) moves.push({ a: a, b: b });
  };

  G._goalColors = function () {
    const s = new Set();
    for (const g of this.goals) if (g.kind === 'collect' && g.got < g.n) s.add(g.t);
    return s;
  };

  /* Quick estimate of how good a move is (used for hints and the casual bot) */
  G._dropRows = function () {
    // Lowest drop in each column (so matches underneath it can be favoured)
    if (!this._dropGoal()) return null;
    const rows = {};
    for (let i = 0; i < this.n; i++) {
      const c = this.cells[i];
      if (c && c.k === 'd') { const col = i % this.cols, r = (i / this.cols) | 0; if (rows[col] === undefined || r > rows[col]) rows[col] = r; }
    }
    return rows;
  };

  G.rateMove = function (m) {
    const goalColors = this._goalColors();
    const A = this.cells[m.a], B = this.cells[m.b];
    const dropRows = this._dropRows();
    if (m.special) {
      const sa = A.k === 'p' ? A.s : null, sb = B.k === 'p' ? B.s : null;
      let v = 14;
      if (sa === 'bell' || sb === 'bell') v = 30;
      if (sa && sb) v = 40;
      // A column Rocket fired underneath a drop sends it straight down
      if (dropRows && sa === 'col' && !sb) {
        const col = m.b % this.cols, r = (m.b / this.cols) | 0;
        if (dropRows[col] !== undefined && dropRows[col] < r) v += 25;
      }
      return v;
    }
    this.cells[m.a] = B; this.cells[m.b] = A;
    let v = 0;
    const sealGoal = this.goals.some(g => g.kind === 'seal' && g.got < g.n);
    const crateGoal = this.goals.some(g => g.kind === 'crate' && g.got < g.n);
    for (const i of [m.a, m.b]) {
      const L = this._lineAt(i);
      if (L.t < 0) continue;
      const h = L.h >= 3 ? L.h : 0, vv = L.v >= 3 ? L.v : 0;
      if (!h && !vv) continue;
      let n = h + vv;
      if (h >= 5 || vv >= 5) n += 12;
      else if (h >= 3 && vv >= 3) n += 8;
      else if (h === 4 || vv === 4) n += 5;
      if (goalColors.has(L.t)) n += 2 * (h + vv);
      if (sealGoal || crateGoal || dropRows) {
        const cells = this._lineCells(i, L);
        for (const ci of cells) {
          if (sealGoal && this.seals[ci] > 0) n += 3;
          if (crateGoal) for (const nb of this._nbrs(ci)) { const c = this.cells[nb]; if (c && c.k === 'c') n += 2; }
          if (dropRows) {
            const col = ci % this.cols, r = (ci / this.cols) | 0;
            if (dropRows[col] !== undefined && dropRows[col] < r) n += 5;
          }
        }
      }
      v += n;
    }
    this.cells[m.a] = A; this.cells[m.b] = B;
    // Swapping a drop downward moves it one row closer to delivery
    if (dropRows) {
      if (A.k === 'd' && m.b === m.a + this.cols) v += 8;
      if (B.k === 'd' && m.b === m.a + this.cols) v -= 6;
    }
    return v;
  };

  G._lineCells = function (i, L) {
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C, t = L.t, out = [i];
    if (L.h >= 3) {
      for (let k = c - 1; k >= 0 && this.color(r * C + k) === t; k--) out.push(r * C + k);
      for (let k = c + 1; k < C && this.color(r * C + k) === t; k++) out.push(r * C + k);
    }
    if (L.v >= 3) {
      for (let k = r - 1; k >= 0 && this.color(k * C + c) === t; k--) out.push(k * C + c);
      for (let k = r + 1; k < R && this.color(k * C + c) === t; k++) out.push(k * C + c);
    }
    return out;
  };

  /* Which line a plain swap would make (for the tutorial's wording) */
  G.previewMove = function (m) {
    const A = this.cells[m.a], B = this.cells[m.b];
    if (!A || !B) return null;
    this.cells[m.a] = B; this.cells[m.b] = A;
    let res = null;
    for (const i of [m.b, m.a]) {
      const L = this._lineAt(i);
      if (L.t >= 0 && (L.h >= 3 || L.v >= 3)) { res = { t: L.t, cells: this._lineCells(i, L) }; break; }
    }
    this.cells[m.a] = A; this.cells[m.b] = B;
    return res;
  };

  G.bestMove = function () {
    const moves = this.findMoves();
    let best = null, bv = -Infinity;
    for (const m of moves) {
      const v = this.rateMove(m);
      if (v > bv) { bv = v; best = m; }
    }
    return best;
  };

  /* ---------- Snapshots for the renderer ---------- */
  G.snapshot = function () {
    return {
      cells: this.cells.map(c => c ? { id: c.id, k: c.k, t: c.t, s: c.s, hp: c.hp } : null),
      seals: this.seals.slice(),
      score: this.score,
      moves: this.moves,
      goals: this.goals.map(g => ({ kind: g.kind, t: g.t, n: g.n, got: g.got }))
    };
  };
  G._phase = function (out, kind, extra) {
    if (!out) return;
    const p = Object.assign({ kind: kind }, extra || {});
    p.snap = this.snapshot();
    out.push(p);
  };

  /* ---------- Goals ---------- */
  G._collect = function (t) {
    if (t == null || t < 0) return;
    for (const g of this.goals) if (g.kind === 'collect' && g.t === t && g.got < g.n) g.got++;
  };
  G._goal = function (kind, k) {
    for (const g of this.goals) if (g.kind === kind) g.got = Math.min(g.n, g.got + k);
  };
  G.goalsDone = function () { return this.goals.every(g => g.got >= g.n); };

  /* ---------- Blast shapes ---------- */
  G._targets = function (kind, i, color) {
    const R = this.rows, C = this.cols, r = (i / C) | 0, c = i % C, out = new Set();
    const add = (rr, cc) => { if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.add(rr * C + cc); };
    switch (kind) {
      case 'row': for (let k = 0; k < C; k++) add(r, k); break;
      case 'col': for (let k = 0; k < R; k++) add(k, c); break;
      case 'keg': for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(r + dr, c + dc); break;
      case 'bigkeg': for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) add(r + dr, c + dc); break;
      case 'cross': for (let k = 0; k < C; k++) add(r, k); for (let k = 0; k < R; k++) add(k, c); break;
      case 'bigcross':
        for (let d = -1; d <= 1; d++) { for (let k = 0; k < C; k++) add(r + d, k); for (let k = 0; k < R; k++) add(k, c + d); }
        break;
      case 'bell': for (let k = 0; k < this.n; k++) if (this.color(k) === color) out.add(k); break;
      case 'all': for (let k = 0; k < this.n; k++) out.add(k); break;
      case 'cannon': for (let k = 0; k < C; k++) add(r, k); break;
      default: break; // 'ring', 'gavel'
    }
    return Array.from(out);
  };

  G._mostCommonColor = function (exclude) {
    const cnt = new Array(this.types).fill(0);
    for (let i = 0; i < this.n; i++) {
      if (exclude && exclude.has(i)) continue;
      const t = this.color(i);
      if (t >= 0) cnt[t]++;
    }
    // Favour a colour the player still needs to collect
    const goalColors = this._goalColors();
    let best = -1, bn = 0;
    for (let t = 0; t < this.types; t++) {
      const score = cnt[t] + (goalColors.has(t) && cnt[t] > 0 ? 100 : 0);
      if (score > bn) { bn = score; best = t; }
    }
    return best;
  };

  G._hit = function (t, x) {
    if (x.protect.has(t)) return 0;
    const c = this.cells[t];
    if (!c) return 0;
    if (c.k === 'c') { x.hitCrate(t); return 0; }
    if (c.k !== 'p') return 0; // drops cannot be destroyed
    x.toClear.add(t);
    if (c.s && !x.activated.has(t)) x.queue.push({ i: t });
    return 1;
  };

  /* ---------- One clearing step: matches, special blasts, seals, crates ---------- */
  G._clearPhase = function (out, o) {
    const mult = o.mult || 1;
    const toClear = new Set(), counted = new Set(), sealCells = new Set();
    const crateHits = new Map(), protect = new Set(), activated = new Set();
    const created = [], fx = [], queue = [];
    let pts = 0;
    const hitCrate = i => crateHits.set(i, (crateHits.get(i) || 0) + 1);
    const ctx = { toClear, queue, activated, protect, hitCrate };

    if (o.groups) {
      for (const g of o.groups) {
        const sp = decideSpecial(g);
        let place = -1;
        if (sp) {
          place = this._placeCell(g, sp, o.prefer || []);
          const cur = this.cells[place];
          const keep = !!(cur && cur.k === 'p' && !cur.s);
          created.push({ i: place, t: sp === 'bell' ? -1 : g.t, s: sp, keep: keep });
          if (keep) protect.add(place);
          pts += CREATE_BONUS[sp];
          this.stats.made[sp]++;
        }
        const adj = new Set();
        g.cells.forEach(ci => {
          sealCells.add(ci);
          if (!protect.has(ci)) toClear.add(ci);
          this._collect(g.t);
          counted.add(ci);
          for (const nb of this._nbrs(ci)) { const c = this.cells[nb]; if (c && c.k === 'c') adj.add(nb); }
        });
        adj.forEach(hitCrate);
        const cells = Array.from(g.cells);
        fx.push({ fx: 'match', cells: cells, t: g.t, at: place >= 0 ? place : this._center(cells),
          pts: cells.length * PIECE_PTS * mult + (sp ? CREATE_BONUS[sp] : 0), special: sp });
      }
      pts += protect.size * PIECE_PTS * mult;
    }

    if (o.hits) for (const i of o.hits) this._hit(i, ctx);
    if (o.crateHits) for (const i of o.crateHits) { const c = this.cells[i]; if (c && c.k === 'c') hitCrate(i); }
    if (o.consumed) for (const i of o.consumed) { activated.add(i); toClear.add(i); }
    if (o.seeds) for (const s of o.seeds) queue.push(s);
    if (o.fx) fx.push(o.fx);
    toClear.forEach(ci => {
      const c = this.cells[ci];
      if (c && c.k === 'p' && c.s && !activated.has(ci)) queue.push({ i: ci });
    });

    let guard = 0;
    while (queue.length && guard++ < 1000) {
      const sd = queue.shift();
      const i = sd.i, c = this.cells[i];
      if (!sd.force) {
        if (activated.has(i)) continue;
        if (!c || c.k !== 'p' || !c.s) continue;
      }
      const kind = sd.as || (c && c.k === 'p' ? c.s : null);
      if (!kind) continue;
      activated.add(i);
      if (c && c.k === 'p' && !protect.has(i)) toClear.add(i);
      let color = sd.color;
      if (kind === 'bell' && (color == null || color < 0)) color = this._mostCommonColor(toClear);
      const targets = this._targets(kind, i, color);
      let hitN = 0;
      for (const t of targets) { if (t !== i) hitN += this._hit(t, ctx); }
      fx.push({ fx: kind, at: i, cells: targets, color: color, pts: hitN * PIECE_PTS * mult + (FIRE_BONUS[kind] || 0) });
      pts += FIRE_BONUS[kind] || 0;
      this.stats.fired[kind] = (this.stats.fired[kind] || 0) + 1;
    }

    const removed = [];
    toClear.forEach(ci => {
      if (protect.has(ci)) return;
      const c = this.cells[ci];
      if (!c || c.k !== 'p') return;
      removed.push({ id: c.id, i: ci, t: c.t, s: c.s });
      if (!counted.has(ci)) this._collect(c.t);
      pts += PIECE_PTS * mult;
      sealCells.add(ci);
      this.cells[ci] = null;
    });

    const sealsHit = [];
    sealCells.forEach(ci => {
      if (this.seals[ci] > 0) {
        this.seals[ci]--;
        sealsHit.push(ci);
        pts += SEAL_PTS;
        this._goal('seal', 1);
      }
    });

    const cratesHit = [];
    crateHits.forEach((h, ci) => {
      const c = this.cells[ci];
      if (!c || c.k !== 'c') return;
      c.hp -= h;
      if (c.hp <= 0) {
        removed.push({ id: c.id, i: ci, k: 'c' });
        this.cells[ci] = null;
        this._goal('crate', 1);
        pts += CRATE_BREAK_PTS;
      } else { cratesHit.push(ci); pts += CRATE_HIT_PTS; }
    });

    const made = [];
    for (const cr of created) {
      const cur = this.cells[cr.i];
      if (cr.keep && cur && cur.k === 'p') {
        cur.s = cr.s; cur.t = cr.t;
        made.push({ id: cur.id, i: cr.i, s: cr.s, t: cr.t });
      } else {
        const p = { id: this.nextId++, k: 'p', t: cr.t, s: cr.s };
        this.cells[cr.i] = p;
        made.push({ id: p.id, i: cr.i, s: cr.s, t: cr.t, fresh: true });
      }
    }

    this.score += pts;
    this._phase(out, 'clear', { removed: removed, made: made, sealsHit: sealsHit, cratesHit: cratesHit, fx: fx, pts: pts, mult: mult });
    return removed.length + made.length + sealsHit.length + cratesHit.length;
  };

  /* ---------- Gravity and refill ---------- */
  G._spawn = function () {
    const g = this._dropGoal();
    if (g) {
      const on = this.dropsOnBoard();
      if (on < this.maxDrops && g.got + on < g.n && this.movesUsed >= (this.L.dropDelay || 0)) {
        return { id: this.nextId++, k: 'd' };
      }
    }
    return { id: this.nextId++, k: 'p', t: this.rng.int(this.types), s: null };
  };

  G._gravity = function (out) {
    const R = this.rows, C = this.cols, moves = [], spawns = [];
    let any = false;
    for (let c = 0; c < C; c++) {
      let w = R - 1;
      for (let r = R - 1; r >= 0; r--) {
        const i = r * C + c, cell = this.cells[i];
        if (cell) {
          if (r !== w) {
            this.cells[w * C + c] = cell;
            this.cells[i] = null;
            moves.push({ id: cell.id, from: i, to: w * C + c });
            any = true;
          }
          w--;
        }
      }
      const empties = w + 1;
      for (let r = w; r >= 0; r--) {
        const cell = this._spawn();
        this.cells[r * C + c] = cell;
        spawns.push({ id: cell.id, to: r * C + c, fromRow: r - empties });
        any = true;
      }
    }
    if (any) this._phase(out, 'fall', { moves: moves, spawns: spawns });
    return any;
  };

  G._deliverDrops = function (out) {
    const R = this.rows, C = this.cols, got = [];
    for (let c = 0; c < C; c++) {
      const i = (R - 1) * C + c, cell = this.cells[i];
      if (cell && cell.k === 'd') {
        got.push({ id: cell.id, i: i, k: 'd' });
        this.cells[i] = null;
        this._goal('drop', 1);
        this.score += DROP_PTS;
      }
    }
    if (got.length) this._phase(out, 'deliver', { removed: got, pts: got.length * DROP_PTS });
    return got.length > 0;
  };

  /* Let everything fall, then clear cascades until the board is still */
  G._settle = function (out, mult) {
    for (let guard = 0; guard < 80; guard++) {
      this._gravity(out);
      const groups = this.findGroups();
      if (groups.length) {
        mult++;
        this.stats.cascades++;
        this._clearPhase(out, { groups: groups, mult: Math.min(mult, 8) });
        continue;
      }
      if (this._deliverDrops(out)) continue;
      break;
    }
  };

  G._afterTurn = function (out) {
    if (this.goalsDone()) { this.state = 'won'; return; }
    if (this.moves <= 0) { this.state = 'lost'; return; }
    if (!this.findMoves(1).length) this._shuffle(out);
  };

  G._shuffle = function (out) {
    const idxs = [];
    for (let i = 0; i < this.n; i++) { const c = this.cells[i]; if (c && c.k === 'p') idxs.push(i); }
    const pieces = idxs.map(i => this.cells[i]);
    for (let attempt = 0; attempt < 400; attempt++) {
      if (attempt > 0 && attempt % 40 === 0) {
        for (const p of pieces) if (!p.s) p.t = this.rng.int(this.types);
      }
      for (let k = pieces.length - 1; k > 0; k--) {
        const j = this.rng.int(k + 1);
        const tmp = pieces[k]; pieces[k] = pieces[j]; pieces[j] = tmp;
      }
      idxs.forEach((i, k) => { this.cells[i] = pieces[k]; });
      if (!this.findGroups().length && this.findMoves(1).length) break;
    }
    this.stats.shuffles++;
    this._phase(out, 'shuffle', {});
  };

  /* ==========================================================
     Player actions (each returns the phases for the renderer)
     ========================================================== */
  G.trySwap = function (a, b) {
    const out = this.record ? [] : null;
    if (this.state !== 'play' || this.moves <= 0) return { ok: false, reason: 'over', phases: out };
    if (!this.adjacent(a, b)) return { ok: false, reason: 'far', phases: out };
    const A = this.cells[a], B = this.cells[b];
    if (!A || !B || A.k === 'c' || B.k === 'c') return { ok: false, reason: 'blocked', phases: out };
    const aSp = A.k === 'p' && A.s, bSp = B.k === 'p' && B.s;
    const dropDown = (A.k === 'd' && b === a + this.cols && B.k !== 'd') || (B.k === 'd' && a === b + this.cols && A.k !== 'd');
    this.cells[a] = B; this.cells[b] = A;
    if (aSp || bSp) {
      this._phase(out, 'swap', { a: a, b: b });
      this._useMove();
      this._specialSwap(out, a, b);
    } else if (dropDown) {
      // Moving a drop one row down is always allowed; the piece that rose may still match
      this._phase(out, 'swap', { a: a, b: b });
      this._useMove();
      const groups = this.findGroups();
      if (groups.length) this._clearPhase(out, { groups: groups, prefer: [b, a], mult: 1 });
      this._settle(out, 1);
    } else {
      const groups = this.findGroups();
      if (!groups.length) {
        this.cells[a] = A; this.cells[b] = B;
        if (out) out.push({ kind: 'swapBack', a: a, b: b, snap: this.snapshot() });
        return { ok: false, reason: 'nomatch', phases: out };
      }
      this._phase(out, 'swap', { a: a, b: b });
      this._useMove();
      this._clearPhase(out, { groups: groups, prefer: [b, a], mult: 1 });
      this._settle(out, 1);
    }
    this._afterTurn(out);
    return { ok: true, phases: out };
  };

  G._useMove = function () { this.moves--; this.movesUsed++; };

  /* The piece that moved (from a) now sits at b */
  G._specialSwap = function (out, a, b) {
    const P = this.cells[b], Q = this.cells[a];
    const ps = P.k === 'p' ? P.s : null, qs = Q.k === 'p' ? Q.s : null;

    if (ps === 'bell' && qs === 'bell') {
      this._clearPhase(out, { seeds: [{ i: b, as: 'all', force: true }], consumed: [a, b], mult: 1 });
    } else if (ps === 'bell' || qs === 'bell') {
      const bellCell = ps === 'bell' ? b : a, otherCell = ps === 'bell' ? a : b;
      const O = this.cells[otherCell];
      if (O.k === 'p' && O.s) {

        const color = O.t, conv = [];

          }

        this._phase(out, 'convert', { cells: conv, at: bellCell });
        const seeds = [{ i: bellCell, as: 'ring', force: true }];
        for (let k = 0; k < this.n; k++) {
          const c = this.cells[k];
          if (c && c.k === 'p' && c.t === color && c.s && c.s !== 'bell') seeds.push({ i: k });
        }
        this._clearPhase(out, { seeds: seeds, consumed: [bellCell], mult: 1 });
      } else {
        const color = O.k === 'p' ? O.t : this._mostCommonColor(null);
        this._clearPhase(out, { seeds: [{ i: bellCell, as: 'bell', color: color, force: true }], consumed: [bellCell], mult: 1 });
      }
    } else if (ps && qs) {
      const lines = (ps === 'row' || ps === 'col' ? 1 : 0) + (qs === 'row' || qs === 'col' ? 1 : 0);
      const as = (ps === 'keg' && qs === 'keg') ? 'bigkeg' : (lines === 2 ? 'cross' : 'bigcross');
      this._clearPhase(out, { seeds: [{ i: b, as: as, force: true }], consumed: [a, b], mult: 1 });
    } else {
      // One Rocket or Keg swapped with a plain piece: it goes off where it lands,
      // and the plain piece still counts if it made a match.
      const spCell = ps ? b : a;
      const groups = this.findGroups();
      this._clearPhase(out, { groups: groups, prefer: [b, a], seeds: [{ i: spCell, force: true }], mult: 1 });
    }
    this._settle(out, 1);
  };

  /* Boosters: none of these use up a move */
  G.useGavel = function (i) {
    const out = this.record ? [] : null;
    const c = this.cells[i];

    if (c.k === 'c') this._clearPhase(out, { crateHits: [i], fx: { fx: 'gavel', at: i, cells: [i] }, mult: 1 });

    else this._clearPhase(out, { hits: [i], fx: { fx: 'gavel', at: i, cells: [i] }, mult: 1 });
    this._settle(out, 1);

  };

  G.useCannon = function (row) {
    const out = this.record ? [] : null;
    if (this.state !== 'play' || row < 0 || row >= this.rows) return { ok: false, phases: out };

  };

  G.useShuffle = function () {

  G.addMoves = function (k) {
    this.moves += k;

    if (!this.findMoves(1).length) this._shuffle(out);
    return out;
  };

  /* Leftover moves turn into Rockets that all go off: the victory fireworks */
  G.celebrate = function () {
    const out = this.record ? [] : null;
    const left = this.moves;
    if (left > 0) {
      const cand = [];
      for (let i = 0; i < this.n; i++) { const c = this.cells[i]; if (c && c.k === 'p' && !c.s) cand.push(i); }

    }
    for (let wave = 0; wave < 12; wave++) {
      const seeds = [];
      for (let i = 0; i < this.n; i++) { const c = this.cells[i]; if (c && c.k === 'p' && c.s) seeds.push({ i: i }); }
      if (!seeds.length) break;
      this._clearPhase(out, { seeds: seeds, mult: 1 });
      this._settle(out, 1);
    }
    return out;
  };

  G.starsFor = function (score) {
    const s = this.L.stars || [0, 0, 0];
    return 1 + (score >= s[1] ? 1 : 0) + (score >= s[2] ? 1 : 0);
  };

  G.clone = function () {
    const g = Object.create(Game.prototype);
    Object.assign(g, this);
    g.cells = this.cells.map(c => c ? Object.assign({}, c) : null);
    g.seals = this.seals.slice();
    g.goals = this.goals.map(x => Object.assign({}, x));
    g.rng = this.rng.clone();
    g.stats = JSON.parse(JSON.stringify(this.stats));
    g.record = false;
    return g;
  };

  const Engine = { Game: Game, RNG: RNG, decideSpecial: decideSpecial };
  if (typeof module !== 'undefined' && module.exports) module.exports = Engine;
  else root.Engine = Engine;
})(typeof window !== 'undefined' ? window : this);

    const fx = () => S.settings.sound;
    const mus = () => S.settings.music;
    function tone(f, t, dur, type, vol, f2) {
      const c = ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain(), t0 = c.currentTime + (t || 0);
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f, t0);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.15, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function noise(t, dur, vol, freq, type, q) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + (t || 0);
      const src = c.createBufferSource();
      src.buffer = noiseBuf;
      const f = c.createBiquadFilter();
      f.type = type || 'bandpass';
      f.frequency.value = freq || 1000;
      if (q) f.Q.value = q;
      const g = c.createGain();
      g.gain.setValueAtTime(vol || 0.2, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0, Math.random() * 0.5, dur + 0.05);
    }
    const PENT = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98];
    return {
      unlock() { ac(); },
      click() { if (fx()) tone(700, 0, 0.06, 'triangle', 0.07); },
      select() { if (fx()) tone(540, 0, 0.08, 'triangle', 0.1); },
      swap() { if (fx()) tone(330, 0, 0.12, 'sine', 0.08, 520); },
      bad() { if (fx()) { tone(196, 0, 0.12, 'square', 0.045); tone(165, 0.11, 0.16, 'square', 0.045); } },
      pop(chain) {
        if (!fx()) return;
        const f = PENT[Math.min(chain - 1, PENT.length - 1)];
        tone(f, 0, 0.18, 'triangle', 0.14); tone(f * 2, 0, 0.1, 'sine', 0.04);
      },
      made() { if (fx()) [784, 988, 1319].forEach((f, i) => tone(f, i * 0.07, 0.16, 'triangle', 0.1)); },
      rocket() { if (fx()) { noise(0, 0.4, 0.16, 3000, 'highpass'); tone(1200, 0, 0.35, 'sawtooth', 0.025, 300); } },
      boom() { if (fx()) { noise(0, 0.6, 0.5, 500, 'lowpass'); tone(120, 0, 0.45, 'sine', 0.35, 38); } },
      bell() {
        if (!fx()) return;
        [[1, 0.16, 2.2], [2, 0.08, 1.6], [2.76, 0.06, 1.2], [5.4, 0.03, 0.8], [8.9, 0.02, 0.5]].forEach(p => tone(392 * p[0], 0, p[2], 'sine', p[1]));
      },
      seal() { if (fx()) { noise(0, 0.12, 0.25, 2200, 'bandpass', 2); tone(260, 0, 0.1, 'square', 0.03); } },
      crate() { if (fx()) { noise(0, 0.18, 0.4, 700, 'bandpass', 1.2); tone(140, 0, 0.15, 'triangle', 0.12, 90); } },
      deliver() { if (fx()) [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.2, 'triangle', 0.12)); },
      coin() { if (fx()) { tone(1319, 0, 0.09, 'square', 0.045); tone(1976, 0.08, 0.22, 'square', 0.045); } },
      star(i) { if (!fx()) return; const f = [784, 988, 1175][i] || 1175; tone(f, 0, 0.35, 'triangle', 0.14); tone(f * 2, 0.02, 0.25, 'sine', 0.04); },
      shuffle() { if (fx()) for (let i = 0; i < 6; i++) noise(i * 0.05, 0.08, 0.12, 1500 + i * 400, 'bandpass', 3); },
      gavel() { if (fx()) { noise(0, 0.1, 0.45, 900, 'bandpass', 1.5); tone(180, 0, 0.12, 'triangle', 0.2, 110); } },
      drumroll() {
        if (!mus()) return;
        for (let i = 0; i < 12; i++) noise(i * 0.045, 0.05, 0.12 + i * 0.01, 1800, 'bandpass', 0.8);
        noise(0.56, 0.25, 0.45, 180, 'lowpass'); tone(90, 0.56, 0.3, 'sine', 0.3, 50);
      },
      /* "Yankee Doodle" (a traditional 1700s tune) on a fife, with a snare */
      fanfare() {
        if (!mus()) return;
        const E = 0.15, N = { G3: 196, A3: 220, B3: 246.94, C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23 };
        const tune = 'C4 C4 D4 E4 C4 E4 D4 G3 C4 C4 D4 E4 C4:2 B3:2 C4 C4 D4 E4 F4 E4 D4 C4 B3 G3 A3 B3 C4:2 C4:2'.split(' ');
        let t = 0;
        tune.forEach(n => {
          const parts = n.split(':'), len = +(parts[1] || 1), f = N[parts[0]] * 4;
          tone(f, t, len * E * 0.92, 'square', 0.03);
          tone(f, t, len * E * 0.92, 'triangle', 0.06);
          t += len * E;
        });
        for (let k = 0; k < t / (E * 2); k++) noise(k * E * 2, 0.06, 0.08, 2500, 'bandpass', 1);
      },
      lose() { if (mus()) [392, 349, 311, 262].forEach((f, i) => tone(f, i * 0.18, 0.3, 'triangle', 0.1)); }
    };
  })();
