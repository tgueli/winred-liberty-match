/* ==========================================================
   Liberty Match 1776 · Level 1 Styles
   ========================================================== */
:root {
  --navy: #1c2b4b;
  --navy-2: #26395f;
  --navy-3: #33497a;
  --navy-deep: #111b31;
  --red: #b22234;
  --red-2: #8f1a29;
  --red-hi: #cf3346;
  --parch: #f2e6c8;
  --parch-2: #e8d7ad;
  --parch-3: #d8c08a;
  --vellum: #fbf5e6;
  --gilt: #c8962e;
  --gilt-hi: #ecc766;
  --gilt-lo: #86611a;
  --ink: #2b2118;
  --ink-2: #5b4a37;
  --ink-3: #7d6a52;
  --green: #2e7d4f;
  --green-2: #226140;
  --white: #fffdf7;
  --ui: "Atkinson Hyperlegible", Verdana, "Segoe UI", system-ui, sans-serif;
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  --gutter: 16px;
  --radius: 14px;
}

html { height: 100%; box-sizing: border-box; font-size: 20px; -webkit-text-size-adjust: 100%; }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; overflow: hidden; font-family: var(--ui); font-size: 1rem; line-height: 1.45; color: var(--ink); background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .06) 0 1.2px, transparent 1.6px) 0 0 / 26px 26px, var(--navy-deep); -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
svg { display: block; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden; background: var(--parch); box-shadow: 0 0 0 1px rgba(0, 0, 0, .3), 0 0 60px rgba(0, 0, 0, .5); user-select: none; -webkit-user-select: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.parchment { background: radial-gradient(ellipse at 50% -10%, rgba(255, 252, 240, .75), transparent 60%), radial-gradient(ellipse at 110% 110%, rgba(134, 97, 26, .22), transparent 55%), radial-gradient(ellipse at -10% 90%, rgba(134, 97, 26, .16), transparent 50%), var(--parch); }
[hidden] { display: none !important; }
.sb-star svg, .hand svg { width: 100%; height: 100%; }

/* Buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: .6rem 1.2rem; border: 0; border-radius: 12px; font-family: var(--ui); font-weight: 700; font-size: 1.05rem; line-height: 1.15; text-align: center; cursor: pointer; touch-action: manipulation; transition: transform .08s ease, filter .15s ease; }
.btn:active { transform: translateY(2px); }
.btn-xl { min-height: 3.5rem; font-size: 1.2rem; width: 100%; }
.btn-red { color: var(--white); text-shadow: 0 1px 0 rgba(0, 0, 0, .35); background: linear-gradient(#c92b3f, #a41d30); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .22), 0 3px 0 #6b1220; }
.btn-red::before { content: ""; position: absolute; inset: 5px; border: 1.5px dashed rgba(255, 238, 205, .55); border-radius: 8px; pointer-events: none; }

/* Game screen */
#scr-game { background: radial-gradient(ellipse at 50% 35%, rgba(60, 86, 144, .55), transparent 70%), radial-gradient(circle at 50% 50%, rgba(255, 255, 255, .07) 0 1px, transparent 1.5px) 0 0 / 22px 22px, var(--navy); color: #fff; }
.gtop { flex: none; display: flex; justify-content: center; padding: .8rem var(--gutter) .3rem; }
.gtitle { text-align: center; line-height: 1.15; }
.gtitle .lv { display: block; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gilt-hi); }
.gtitle .nm { display: block; font-family: var(--serif); font-weight: 700; font-size: 1.2rem; }
.hud { flex: none; display: grid; grid-template-columns: 5.4rem 1fr; gap: .6rem; padding: .3rem var(--gutter) .4rem; }
.hud-box { border-radius: 12px; background: linear-gradient(#fdf8ea, #efe1bd); color: var(--ink); box-shadow: 0 0 0 2.5px var(--gilt), inset 0 -3px 0 rgba(134, 97, 26, .18); }
.moves { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: .25rem 0; }
.moves .lbl, .goals-lbl { font-size: .68rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.moves .val { font-size: 2rem; font-weight: 700; line-height: 1; color: var(--navy); font-variant-numeric: tabular-nums; }
.goals-box { display: flex; flex-direction: column; justify-content: center; padding: .3rem .6rem; gap: .15rem; }
.goals { display: flex; flex-wrap: wrap; gap: .35rem .8rem; align-items: center; }
.goal { display: inline-flex; align-items: center; gap: .3rem; font-weight: 700; font-size: 1.35rem; color: var(--navy); font-variant-numeric: tabular-nums; }
.goal .gi { position: relative; width: 2.3rem; height: 2.3rem; }
.goal .gi svg { width: 100%; height: 100%; }
.goal.done { color: var(--green); }
.goal .ck { display: none; width: 1.5rem; height: 1.5rem; color: #fff; background: var(--green); border-radius: 50%; padding: .2rem; }
.goal.done .n { display: none; }
.goal.done .ck { display: block; }
.scorebar { flex: none; padding: 0 var(--gutter) .35rem; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .6rem; }
.sb-track { position: relative; height: .75rem; border-radius: 999px; background: rgba(0, 0, 0, .35); box-shadow: inset 0 0 0 1.5px rgba(200, 150, 46, .6); }
.sb-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--gilt), var(--gilt-hi)); transition: width .4s ease; }
.sb-star { position: absolute; top: 50%; width: 1.25rem; height: 1.25rem; transform: translate(-50%, -50%); color: rgba(255, 255, 255, .35); }
.sb-star.on { color: var(--gilt-hi); filter: drop-shadow(0 0 4px rgba(236, 199, 102, .9)); }
.score-num { font-weight: 700; font-size: .95rem; font-variant-numeric: tabular-nums; min-width: 4.5rem; text-align: right; color: #f4e7c5; }

/* Board */
.board-wrap { position: relative; flex: 1; min-height: 0; display: grid; place-items: start center; align-content: start; padding: .45rem var(--gutter) .3rem; }
.board { position: relative; border-radius: 12px; background: #f5ead0; box-shadow: 0 0 0 4px var(--gilt), 0 0 0 7px #5e440f, 0 12px 26px rgba(0, 0, 0, .5); touch-action: none; overflow: hidden; }
.board.shake { animation: shake .32s ease; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, 1px); } 80% { transform: translate(2px, -1px); } }
.tiles, .pieces, .fx { position: absolute; inset: 0; }
.fx { pointer-events: none; z-index: 3; }
.pieces { z-index: 2; }
.tile { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); background: #f6ecd3; }
.tile.alt { background: #eadcb6; }
.pc { position: absolute; left: 0; top: 0; width: var(--cell); height: var(--cell); will-change: transform; }
.pc::before { content: ""; position: absolute; left: 18%; right: 18%; bottom: 6%; height: 14%; border-radius: 50%; background: radial-gradient(rgba(60, 40, 10, .35), transparent 70%); }
.pc .ic { position: absolute; left: 7%; top: 6%; width: 86%; height: 86%; transition: transform .15s ease; }
.pc .ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.pc.sp-col .ov { transform: rotate(90deg); }
.pc.sp-row .ic, .pc.sp-col .ic, .pc.sp-keg .ic { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 5px rgba(255, 207, 63, .95)); } }
.pc .rays { position: absolute; inset: -8%; border-radius: 50%; background: repeating-conic-gradient(rgba(255, 214, 90, .85) 0 9deg, rgba(255, 214, 90, 0) 9deg 30deg); -webkit-mask: radial-gradient(circle, #000 30%, transparent 70%); mask: radial-gradient(circle, #000 30%, transparent 70%); animation: spin 5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pc.sel .ic { transform: scale(1.12); }
.pc.sel::after { content: ""; position: absolute; inset: 2%; border-radius: 24%; border: 4px solid #ffcf3f; box-shadow: 0 0 12px rgba(255, 207, 63, .9), inset 0 0 8px rgba(255, 207, 63, .6); }
.pc.pop .ic { animation: pop .26s ease-in forwards; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.28); opacity: 1; } 100% { transform: scale(0); opacity: 0; } }
.pc.pop::before { opacity: 0; }
.pc.made .ic { animation: made .5s ease-out; }
@keyframes made { 0% { transform: scale(.4) rotate(-30deg); } 60% { transform: scale(1.3) rotate(6deg); } 100% { transform: scale(1); } }
.pc.hit .ic { animation: hit .3s ease; }
@keyframes hit { 25% { transform: translateX(-8%) rotate(-5deg); } 75% { transform: translateX(8%) rotate(5deg); } }
.board.tut .pc:not(.tut-on) { opacity: .3; }
.board.tut .pc.tut-on::after { content: ""; position: absolute; inset: 0; border-radius: 24%; border: 4px solid #fff; box-shadow: 0 0 14px #fff; animation: ping2 1.2s ease-in-out infinite; }
@keyframes ping2 { 50% { transform: scale(1.08); } }
.hand { position: absolute; left: 0; top: 0; z-index: 5; width: calc(var(--cell) * .9); height: calc(var(--cell) * .9); pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .4)); animation: handmove 1.8s ease-in-out infinite; }
@keyframes handmove { 0%, 15% { transform: translate(var(--hx0), var(--hy0)) scale(1); } 25% { transform: translate(var(--hx0), var(--hy0)) scale(.85); } 60%, 70% { transform: translate(var(--hx1), var(--hy1)) scale(.85); } 85%, 100% { transform: translate(var(--hx1), var(--hy1)) scale(1); opacity: 0; } }

/* Effects */
.beam { position: absolute; border-radius: 999px; background: linear-gradient(90deg, rgba(255, 255, 255, 0), #fff 20%, #ffe28a 50%, #fff 80%, rgba(255, 255, 255, 0)); box-shadow: 0 0 16px #ffd34d, 0 0 30px rgba(255, 150, 40, .7); }
.beam.h { height: 34%; animation: beamh .42s ease-out forwards; }
.beam.v { width: 34%; background: linear-gradient(180deg, rgba(255, 255, 255, 0), #fff 20%, #ffe28a 50%, #fff 80%, rgba(255, 255, 255, 0)); animation: beamv .42s ease-out forwards; }
.beam.cannon { box-shadow: 0 0 16px #ff8a3d, 0 0 34px rgba(210, 40, 40, .8); }
@keyframes beamh { 0% { transform: scaleX(.05); opacity: 1; } 55% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1) scaleY(.2); opacity: 0; } }
@keyframes beamv { 0% { transform: scaleY(.05); opacity: 1; } 55% { transform: scaleY(1); opacity: 1; } 100% { transform: scaleY(1) scaleX(.2); opacity: 0; } }
.blast { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff 0 15%, #ffe28a 30%, #ff9a3d 55%, rgba(210, 50, 40, 0) 72%); animation: blast .5s ease-out forwards; }
@keyframes blast { 0% { transform: scale(.2); opacity: 1; } 70% { opacity: .95; } 100% { transform: scale(1.15); opacity: 0; } }
.flash { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .95), rgba(255, 226, 138, .6) 45%, rgba(255, 226, 138, 0) 70%); animation: flash .45s ease-out forwards; }
@keyframes flash { 0% { transform: scale(.3); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
.bell-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.bell-lines line { stroke: #ffd34d; stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px #fff); animation: zap .5s ease-out forwards; }
@keyframes zap { 0% { opacity: 1; stroke-dasharray: 0 400; } 50% { stroke-dasharray: 400 0; opacity: 1; } 100% { opacity: 0; } }
.pts { position: absolute; z-index: 6; transform: translate(-50%, -50%); font-weight: 700; font-size: 1.15rem; color: #fff; white-space: nowrap; text-shadow: 0 0 3px var(--navy), 0 2px 0 var(--navy), 2px 0 0 var(--navy), -2px 0 0 var(--navy), 0 -2px 0 var(--navy); animation: rise .9s ease-out forwards; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.7); } 20% { opacity: 1; transform: translate(-50%, -60%) scale(1.1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
.spark { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: spark .8s ease-out forwards; }
@keyframes spark { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(260deg); opacity: 0; } }

.banner { position: absolute; left: 50%; top: 50%; z-index: 8; transform: translate(-50%, -50%); width: max-content; max-width: calc(100% - 2 * var(--gutter)); padding: .7rem 1.4rem; border-radius: 14px; background: var(--red); color: #fff; font-family: var(--serif); font-weight: 700; font-size: 1.5rem; text-align: center; box-shadow: 0 0 0 3px var(--gilt), 0 10px 24px rgba(0, 0, 0, .45); pointer-events: none; animation: bannerIn .35s cubic-bezier(.2, 1.4, .5, 1); }
.banner small { display: block; font-family: var(--ui); font-weight: 400; font-size: .85rem; }
@keyframes bannerIn { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } }

/* Modals */
#modal-root { position: absolute; inset: 0; z-index: 50; pointer-events: none; }
.backdrop { position: absolute; inset: 0; display: grid; place-items: center; padding: var(--gutter); background: rgba(10, 16, 30, .62); pointer-events: auto; animation: fadeIn .2s ease; }
@keyframes fadeIn { from { opacity: 0; } }
.modal { position: relative; width: 100%; max-height: 100%; overflow-y: auto; padding: 1.3rem 1.1rem 1.1rem; border-radius: 18px; background: radial-gradient(ellipse at 50% 0%, rgba(255, 252, 240, .9), transparent 60%), var(--parch); box-shadow: 0 0 0 3px var(--gilt), 0 0 0 6px var(--navy), 0 18px 40px rgba(0, 0, 0, .5); display: flex; flex-direction: column; gap: .85rem; text-align: center; animation: popIn .3s cubic-bezier(.2, 1.3, .5, 1); }
@keyframes popIn { from { transform: scale(.85); opacity: 0; } }
.modal h2 { font-family: var(--serif); font-weight: 700; font-size: 1.55rem; line-height: 1.15; color: var(--navy); }
.modal h2.display { font-family: var(--display); font-weight: 400; font-size: 2.1rem; }
.modal .actions { display: flex; flex-direction: column; gap: .6rem; margin-top: .2rem; }
.modal .ribbon-h { align-self: center; margin-top: -.2rem; padding: .3rem 1.6rem; background: var(--red); color: #fff; font-weight: 700; font-size: .85rem; letter-spacing: .14em; text-transform: uppercase; clip-path: polygon(0 0, 100% 0, 94% 50%, 100% 100%, 0 100%, 6% 50%); }
.stars-big { display: flex; justify-content: center; gap: .4rem; align-items: flex-end; }
.stars-big svg { width: 3.6rem; height: 3.6rem; color: #cdbb90; }
.stars-big svg:nth-child(2) { width: 4.4rem; height: 4.4rem; }
.stars-big svg.on { color: var(--gilt); filter: drop-shadow(0 0 6px rgba(236, 199, 102, .8)); animation: starIn .45s cubic-bezier(.2, 1.5, .5, 1) both; }
.stars-big svg.on:nth-child(2) { animation-delay: .25s; }
.stars-big svg.on:nth-child(3) { animation-delay: .5s; }
@keyframes starIn { from { transform: scale(0) rotate(-90deg); } }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 60; }
.confetti i { position: absolute; top: -20px; width: 9px; height: 14px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(720deg); } }

@media (prefers-reduced-motion: reduce) {
  .pc .rays, .moves.low .val, .pc.sp-row .ic, .pc.sp-col .ic, .pc.sp-keg .ic { animation: none; }
  .board.shake { animation: none; }
  .confetti { display: none; }
}
</style>

<script>
/* ==========================================================
   Liberty Match 1776 · Engine
   ========================================================== */
(function (root) {
  'use strict';
  function RNG(seed) { this.s = (seed >>> 0) || 1; }
  RNG.prototype.next = function () {
    this.s = (this.s + 0x6D2B79F5) >>> 0;
    let t = this.s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  RNG.prototype.int = function (n) { return Math.floor(this.next() * n); };

  const PIECE_PTS = 20;
  const CREATE_BONUS = { row: 60, col: 60, keg: 90, bell: 150 };
  const FIRE_BONUS = { cross: 60, bigcross: 120, bigkeg: 120, all: 300 };
  const SEAL_PTS = 40, CRATE_HIT_PTS = 20, CRATE_BREAK_PTS = 60, DROP_PTS = 300, LEFTOVER_PTS = 100;

  function decideSpecial(g) {
    let maxLen = 0, hasH = false, hasV = false;
    for (const r of g.runs) {
      if (r.cells.length > maxLen) maxLen = r.cells.length;
      if (r.dir === 'h') hasH = true; else hasV = true;
    }
    if (maxLen >= 5) return 'bell';
    if (hasH && hasV) return 'keg';
    if (maxLen === 4) {
      const r4 = g.runs.find(r => r.cells.length === 4);
      return r4.dir === 'h' ? 'row' : 'col';
    }
    return null;
  }

  function Game(level) {
    this.L = level;
    this.rows = level.rows || 7;
    this.cols = level.cols || 7;
    this.n = this.rows * this.cols;
    this.types = level.types || 5;
    this.rng = new RNG((Math.random() * 4294967296) >>> 0);
    this.nextId = 1;
    this.cells = new Array(this.n).fill(null);
    this.seals = new Array(this.n).fill(0);
    this.moves = level.moves;
    this.movesUsed = 0;
    this.score = 0;
    this.state = 'play';
    this.goals = level.goals.map(g => Object.assign({}, g, { got: 0 }));
    
    let tries = 0;
    do {
      this._fillFresh();
      tries++;
    } while (tries < 300 && (this.findGroups().length || this.findMoves().length < 3));
    if (!this.findMoves(1).length) this._shuffle(null);
  }

  const G = Game.prototype;
  G.rc = function (i) { return [(i / this.cols) | 0, i % this.cols]; };
  G.idx = function (r, c) { return r * this.cols + c; };
  G.color = function (i) { const c = this.cells[i]; return (c && c.k === 'p' && c.s !== 'bell') ? c.t : -1; };
  G.adjacent = function (a, b) {
    if (a < 0 || b < 0 || a >= this.n || b >= this.n) return false;
    const [ra, ca] = this.rc(a), [rb, cb] = this.rc(b);
    return Math.abs(ra - rb) + Math.abs(ca - cb) === 1;
  };
  G._center = function (cells) {
    let sr = 0, sc = 0;
    for (const i of cells) { const [r, c] = this.rc(i); sr += r; sc += c; }
    sr /= cells.length; sc /= cells.length;
    let best = cells[0], bd = 1e9;
    for (const i of cells) {
      const [r, c] = this.rc(i), d = (r - sr) * (r - sr) + (c - sc) * (c - sc);
      if (d < bd) { bd = d; best = i; }
    }
    return best;
  };

  G._fillFresh = function () {
    const R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        const i = this.idx(r, c);
        let t, tries = 0;
        do { t = this.rng.int(this.types); tries++; }
        while (tries < 40 && ((c >= 2 && this.color(i - 1) === t && this.color(i - 2) === t) || (r >= 2 && this.color(i - C) === t && this.color(i - 2 * C) === t)));
        this.cells[i] = { id: this.nextId++, k: 'p', t: t, s: null };
      }
    }
  };

  G.findRuns = function () {
    const runs = [], R = this.rows, C = this.cols;
    for (let r = 0; r < R; r++) {
      let c = 0;
      while (c < C) {
        const t = this.color(r * C + c);
        let e = c + 1;
        if (t >= 0) while (e < C && this.color(r * C + e) === t) e++;
        if (t >= 0 && e - c >= 3) {
          const cells = []; for (let k = c; k < e; k++) cells.push(r * C + k);
          runs.push({ dir: 'h', t: t, cells: cells });
        }
        c = e;
      }
    }
    for (let c = 0; c < C; c++) {
      let r = 0;
      while (r < R) {
        const t = this.color(r * C + c);
        let e = r + 1;
        if (t >= 0) while (e < R && this.color(e * C + c) === t) e++;
        if (t >= 0 && e - r >= 3) {
          const cells = []; for (let k = r; k < e; k++) cells.push(k * C + c);
          runs.push({ dir: 'v', t: t, cells: cells });
        }
        r = e;
      }
    }
    return runs;
  };

  G.findGroups = function () {
    const runs = this.findRuns();
    if (!runs.length) return [];
    const parent = runs.map((_, i) => i);
    const find = i => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const owner = new Map();
    runs.forEach((run, i) => run.cells.forEach(ci => {
      if (owner.has(ci)) { const a = find(owner.get(ci)), b = find(i); if (a !== b) parent[a] = b; } else owner.set(ci, i);
    }));
    const map = new Map();
    runs.forEach((run, i) => {
      const rt = find(i);
      let g = map.get(rt);
      if (!g) { g = { t: run.t, runs: [], cells: new Set() }; map.set(rt, g); }
      g.runs.push(run); run.cells.forEach(ci => g.cells.add(ci));
    });
    return Array.from(map.values());
  };

  G._placeCell = function (g, sp, prefer) {
    for (const p of prefer) if (g.cells.has(p)) return p;
    if (sp === 'keg') {
      const hCells = new Set();
      g.runs.forEach(r => { if (r.dir === 'h') r.cells.forEach(c => hCells.add(c)); });
      for (const r of g.runs) if (r.dir === 'v') for (const c of r.cells) if (hCells.has(c)) return c;
    }
    let best = g.runs[0];
    for (const r of g.runs) if (r.cells.length > best.cells.length) best = r;
    return best.cells[Math.floor((best.cells.length - 1) / 2)];
  };

  G._lineAt = function (i) {
    const t = this.color(i);
    if (t < 0) return { h: 0, v: 0, t: t };
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C;
    let h = 1, v = 1;
    for (let k = c - 1; k >= 0 && this.color(r * C + k) === t; k--) h++;
    for (let k = c + 1; k < C && this.color(r * C + k) === t; k++) h++;
    for (let k = r - 1; k >= 0 && this.color(k * C + c) === t; k--) v++;
    for (let k = r + 1; k < R && this.color(k * C + c) === t; k++) v++;
    return { h: h, v: v, t: t };
  };

  G.findMoves = function (limit) {
    const R = this.rows, C = this.cols, moves = [];
    for (let i = 0; i < this.n; i++) {
      const r = (i / C) | 0, c = i % C;
      if (c + 1 < C) this._checkMove(i, i + 1, moves);
      if (r + 1 < R) this._checkMove(i, i + C, moves);
      if (limit && moves.length >= limit) break;
    }
    return moves;
  };

  G._checkMove = function (a, b, moves) {
    const A = this.cells[a], B = this.cells[b];
    if (!A || !B) return;
    const aSp = A.k === 'p' && A.s, bSp = B.k === 'p' && B.s;
    if (aSp || bSp) {
      if (aSp && !bSp) moves.push({ a: a, b: b, special: true });
      else if (bSp && !aSp) moves.push({ a: b, b: a, special: true });
      else moves.push({ a: a, b: b, special: true, combo: true });
      return;
    }
    this.cells[a] = B; this.cells[b] = A;
    const la = this._lineAt(a), lb = this._lineAt(b);
    this.cells[a] = A; this.cells[b] = B;
    if (la.h >= 3 || la.v >= 3 || lb.h >= 3 || lb.v >= 3) moves.push({ a: a, b: b });
  };

  G.rateMove = function (m) {
    const A = this.cells[m.a], B = this.cells[m.b];
    if (m.special) {
      const sa = A.k === 'p' ? A.s : null, sb = B.k === 'p' ? B.s : null;
      let v = 14;
      if (sa === 'bell' || sb === 'bell') v = 30;
      if (sa && sb) v = 40;
      return v;
    }
    this.cells[m.a] = B; this.cells[m.b] = A;
    let v = 0;
    for (const i of [m.a, m.b]) {
      const L = this._lineAt(i);
      if (L.t < 0) continue;
      const h = L.h >= 3 ? L.h : 0, vv = L.v >= 3 ? L.v : 0;
      if (!h && !vv) continue;
      let n = h + vv;
      if (h >= 5 || vv >= 5) n += 12;
      else if (h >= 3 && vv >= 3) n += 8;
      else if (h === 4 || vv === 4) n += 5;
      v += n;
    }
    this.cells[m.a] = A; this.cells[m.b] = B;
    return v;
  };

  G._lineCells = function (i, L) {
    const C = this.cols, R = this.rows, r = (i / C) | 0, c = i % C, t = L.t, out = [i];
    if (L.h >= 3) {
      for (let k = c - 1; k >= 0 && this.color(r * C + k) === t; k--) out.push(r * C + k);
      for (let k = c + 1; k < C && this.color(r * C + k) === t; k++) out.push(r * C + k);
    }
    if (L.v >= 3) {
      for (let k = r - 1; k >= 0 && this.color(k * C + c) === t; k--) out.push(k * C + c);
      for (let k = r + 1; k < R && this.color(k * C + c) === t; k++) out.push(k * C + c);
    }
    return out;
  };

  G.previewMove = function (m) {
    const A = this.cells[m.a], B = this.cells[m.b];
    if (!A || !B) return null;
    this.cells[m.a] = B; this.cells[m.b] = A;
    let res = null;
    for (const i of [m.b, m.a]) {
      const L = this._lineAt(i);
      if (L.t >= 0 && (L.h >= 3 || L.v >= 3)) { res = { t: L.t, cells: this._lineCells(i, L) }; break; }
    }
    this.cells[m.a] = A; this.cells[m.b] = B;
    return res;
  };

  G.bestMove = function () {
    const moves = this.findMoves();
    let best = null, bv = -Infinity;
    for (const m of moves) { const v = this.rateMove(m); if (v > bv) { bv = v; best = m; } }
    return best;
  };

  G.snapshot = function () {
    return {
      cells: this.cells.map(c => c ? { id: c.id, k: c.k, t: c.t, s: c.s, hp: c.hp } : null),
      score: this.score, moves: this.moves, goals: this.goals.map(g => ({ kind: g.kind, t: g.t, n: g.n, got: g.got }))
    };
  };

  G._phase = function (out, kind, extra) {
    if (!out) return;
    const p = Object.assign({ kind: kind }, extra || {});
    p.snap = this.snapshot();
    out.push(p);
  };

  G._collect = function (t) {
    if (t == null || t < 0) return;
    for (const g of this.goals) if (g.kind === 'collect' && g.t === t && g.got < g.n) g.got++;
  };
  
  G.goalsDone = function () { return this.goals.every(g => g.got >= g.n); };

  G._targets = function (kind, i, color) {
    const R = this.rows, C = this.cols, r = (i / C) | 0, c = i % C, out = new Set();
    const add = (rr, cc) => { if (rr >= 0 && rr < R && cc >= 0 && cc < C) out.add(rr * C + cc); };
    switch (kind) {
      case 'row': for (let k = 0; k < C; k++) add(r, k); break;
      case 'col': for (let k = 0; k < R; k++) add(k, c); break;
      case 'keg': for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(r + dr, c + dc); break;
      case 'bigkeg': for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) add(r + dr, c + dc); break;
      case 'cross': for (let k = 0; k < C; k++) add(r, k); for (let k = 0; k < R; k++) add(k, c); break;
      case 'bigcross': for (let d = -1; d <= 1; d++) { for (let k = 0; k < C; k++) add(r + d, k); for (let k = 0; k < R; k++) add(k, c + d); } break;
      case 'bell': for (let k = 0; k < this.n; k++) if (this.color(k) === color) out.add(k); break;
      case 'all': for (let k = 0; k < this.n; k++) out.add(k); break;
    }
    return Array.from(out);
  };

  G._mostCommonColor = function (exclude) {
    const cnt = new Array(this.types).fill(0);
    for (let i = 0; i < this.n; i++) {
      if (exclude && exclude.has(i)) continue;
      const t = this.color(i);
      if (t >= 0) cnt[t]++;
    }
    let best = -1, bn = 0;
    for (let t = 0; t < this.types; t++) { if (cnt[t] > bn) { bn = cnt[t]; best = t; } }
    return best;
  };

  G._hit = function (t, x) {
    if (x.protect.has(t)) return 0;
    const c = this.cells[t];
    if (!c || c.k !== 'p') return 0;
    x.toClear.add(t);
    if (c.s && !x.activated.has(t)) x.queue.push({ i: t });
    return 1;
  };

  G._clearPhase = function (out, o) {
    const mult = o.mult || 1, toClear = new Set(), counted = new Set();
    const protect = new Set(), activated = new Set();
    const created = [], fx = [], queue = [];
    let pts = 0;
    const ctx = { toClear, queue, activated, protect };

    if (o.groups) {
      for (const g of o.groups) {
        const sp = decideSpecial(g);
        let place = -1;
        if (sp) {
          place = this._placeCell(g, sp, o.prefer || []);
          const cur = this.cells[place], keep = !!(cur && cur.k === 'p' && !cur.s);
          created.push({ i: place, t: sp === 'bell' ? -1 : g.t, s: sp, keep: keep });
          if (keep) protect.add(place);
          pts += CREATE_BONUS[sp];
        }
        g.cells.forEach(ci => { if (!protect.has(ci)) toClear.add(ci); this._collect(g.t); counted.add(ci); });
        const cells = Array.from(g.cells);
        fx.push({ fx: 'match', cells: cells, t: g.t, at: place >= 0 ? place : this._center(cells), pts: cells.length * PIECE_PTS * mult + (sp ? CREATE_BONUS[sp] : 0), special: sp });
      }
      pts += protect.size * PIECE_PTS * mult;
    }

    if (o.hits) for (const i of o.hits) this._hit(i, ctx);
    if (o.consumed) for (const i of o.consumed) { activated.add(i); toClear.add(i); }
    if (o.seeds) for (const s of o.seeds) queue.push(s);
    if (o.fx) fx.push(o.fx);
    toClear.forEach(ci => { const c = this.cells[ci]; if (c && c.k === 'p' && c.s && !activated.has(ci)) queue.push({ i: ci }); });

    let guard = 0;
    while (queue.length && guard++ < 1000) {
      const sd = queue.shift(), i = sd.i, c = this.cells[i];
      if (!sd.force) { if (activated.has(i)) continue; if (!c || c.k !== 'p' || !c.s) continue; }
      const kind = sd.as || (c && c.k === 'p' ? c.s : null);
      if (!kind) continue;
      activated.add(i);
      if (c && c.k === 'p' && !protect.has(i)) toClear.add(i);
      let color = sd.color;
      if (kind === 'bell' && (color == null || color < 0)) color = this._mostCommonColor(toClear);
      const targets = this._targets(kind, i, color);
      let hitN = 0;
      for (const t of targets) { if (t !== i) hitN += this._hit(t, ctx); }
      fx.push({ fx: kind, at: i, cells: targets, color: color, pts: hitN * PIECE_PTS * mult + (FIRE_BONUS[kind] || 0) });
      pts += FIRE_BONUS[kind] || 0;
    }

    const removed = [];
    toClear.forEach(ci => {
      if (protect.has(ci)) return;
      const c = this.cells[ci];
      if (!c || c.k !== 'p') return;
      removed.push({ id: c.id, i: ci, t: c.t, s: c.s });
      if (!counted.has(ci)) this._collect(c.t);
      pts += PIECE_PTS * mult;
      this.cells[ci] = null;
    });

    const made = [];
    for (const cr of created) {
      const cur = this.cells[cr.i];
      if (cr.keep && cur && cur.k === 'p') {
        cur.s = cr.s; cur.t = cr.t; made.push({ id: cur.id, i: cr.i, s: cr.s, t: cr.t });
      } else {
        const p = { id: this.nextId++, k: 'p', t: cr.t, s: cr.s };
        this.cells[cr.i] = p; made.push({ id: p.id, i: cr.i, s: cr.s, t: cr.t, fresh: true });
      }
    }

    this.score += pts;
    this._phase(out, 'clear', { removed: removed, made: made, fx: fx, pts: pts, mult: mult });
    return removed.length + made.length;
  };

  G.trySwap = function (a, b) {

      const groups = this.findGroups();

        this.cells[a] = A; this.cells[b] = B;

    xy(i) { return [(i % this.g.cols) * this.cell, Math.floor(i / this.g.cols) * this.cell]; },

      this.moveEl(ra, ph.b, d); this.moveEl(rb, ph.a, d);
      await wait(d + 20);
      this.moveEl(ra, ph.a, d); this.moveEl(rb, ph.b, d);
      await wait(d + 20);
    },
    
    // Restored FX Functions so rockets/bombs draw correctly
    fxDiv(cls, style, life) {
      const d = document.createElement('div');
      d.className = cls;
      d.style.cssText = style;
      this.fxEl.appendChild(d);
      setTimeout(() => d.remove(), life || 900);
      return d;
    },
    drawFx(f) {
      const C = this.cell, cols = this.g.cols, rows = this.g.rows, p = this.xy(f.at), r = (f.at / cols) | 0, c = f.at % cols;
      const beamH = (row, extra) => this.fxDiv('beam h' + (extra || ''), 'left:0;top:' + (row * C + C * 0.33) + 'px;width:' + (cols * C) + 'px;height:' + (C * 0.34) + 'px;transform-origin:' + (p[0] + C / 2) + 'px 50%');
      const beamV = col => this.fxDiv('beam v', 'top:0;left:' + (col * C + C * 0.33) + 'px;height:' + (rows * C) + 'px;width:' + (C * 0.34) + 'px;transform-origin:50% ' + (p[1] + C / 2) + 'px');
      const blast = rad => { const s = (rad * 2 + 1) * C; this.fxDiv('blast', 'left:' + (p[0] + C / 2 - s / 2) + 'px;top:' + (p[1] + C / 2 - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px'); };
      switch (f.fx) {
        case 'row': beamH(r); break;
        case 'col': beamV(c); break;
        case 'cross': beamH(r); beamV(c); break;
        case 'bigcross': for (let d = -1; d <= 1; d++) { if (r + d >= 0 && r + d < rows) beamH(r + d); if (c + d >= 0 && c + d < cols) beamV(c + d); } break;
        case 'keg': blast(1); break;
        case 'bigkeg': blast(2); break;
        case 'cannon': beamH(r, ' cannon'); break;
        case 'bell': case 'ring': case 'all': this.bellFx(f); break;
        default: break;
      }
    },
    bellFx(f) {
      const C = this.cell, p = this.xy(f.at), cx = p[0] + C / 2, cy = p[1] + C / 2;
      let s = '<svg class="bell-lines" viewBox="0 0 ' + (this.g.cols * C) + ' ' + (this.g.rows * C) + '" aria-hidden="true">';
      (f.cells || []).forEach(t => {
        if (t === f.at) return;
        const q = this.xy(t);
        s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (q[0] + C / 2) + '" y2="' + (q[1] + C / 2) + '"/>';
      });
      const wrap = this.fxDiv('', 'position:absolute;left:0;top:0;right:0;bottom:0', 800);
      wrap.innerHTML = s + '</svg>';
      this.flash(f.at, f.fx === 'all' ? 7 : 2.4);
    },
    flash(i, size) {
      const C = this.cell, p = this.xy(i), s = C * size;
      this.fxDiv('flash', 'left:' + (p[0] + C / 2 - s / 2) + 'px;top:' + (p[1] + C / 2 - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px', 600);
    },
    burst(i, colors) {
      if (REDUCED) return;
      const C = this.cell, p = this.xy(i);
      for (let k = 0; k < 7; k++) {
        const a = Math.random() * Math.PI * 2, d = C * (0.5 + Math.random() * 0.7);
        this.fxDiv('spark', 'left:' + (p[0] + C / 2 - 4) + 'px;top:' + (p[1] + C / 2 - 4) + 'px;background:' + colors[k % colors.length] + ';--dx:' + (Math.cos(a) * d).toFixed(0) + 'px;--dy:' + (Math.sin(a) * d).toFixed(0) + 'px', 850);
      }
    },
    popup(i, text) {
      const C = this.cell, p = this.xy(i);
      const d = this.fxDiv('pts', 'left:' + (p[0] + C / 2) + 'px;top:' + (p[1] + C / 2) + 'px', 950);
      d.textContent = text;
    },
    shake() {
      if (REDUCED) return;
      this.boardEl.classList.remove('shake');
      void this.boardEl.offsetWidth;
      this.boardEl.classList.add('shake');
    },

    async animClear(ph) {
      let origin = -1, big = false;
      ph.fx.forEach(f => {
        if (f.fx === 'match') return;
        if (origin < 0) origin = f.at;
        this.drawFx(f);
        if (/^(bigkeg|all|bigcross|cross)$/.test(f.fx)) big = true;
      });
      if (big) this.shake();

      let maxDelay = 0;
      ph.removed.forEach(r => {
        const rec = this.els.get(r.id);
        if (!rec) return;
        let delay = 0;
        if (origin >= 0) { delay = this.T(this.dist(origin, r.i) * 28); maxDelay = Math.max(maxDelay, delay); }
        if (delay) setTimeout(() => rec.el.classList.add('pop'), delay); 
        else rec.el.classList.add('pop');
      });
      
      ph.fx.forEach(f => { if (f.pts > 0 && f.fx !== 'ring') this.popup(f.at, '+' + fmt(f.pts)); });

      await wait(this.T(250) + maxDelay);
      ph.removed.forEach(r => { const rec = this.els.get(r.id); if (rec) { rec.el.remove(); this.els.delete(r.id); } });
      this.sync(ph.snap, { dur: 0 });
      if (ph.made.length) {
        ph.made.forEach(m => {
          const rec = this.els.get(m.id);
          if (rec) { rec.el.classList.remove('made'); void rec.el.offsetWidth; rec.el.classList.add('made'); }
        });
        await wait(this.T(230));
      }
    },
    async animConvert(ph) {
      const step = this.T(ph.celebrate ? 110 : 70);
      let shown = this.displayMoves;
      for (const i of ph.cells) {
        const c = ph.snap.cells[i];
        const rec = c && this.els.get(c.id);
        if (rec) { rec.el.className = pieceClass(c); rec.el.innerHTML = pieceHTML(c); rec.key = pieceKey(c); rec.el.classList.add('made'); }
        if (ph.celebrate && shown > 0) { shown--; $('#hud-moves-n').textContent = shown; this.popup(i, '+100'); }
        await wait(step);
      }
      this.sync(ph.snap, { dur: 0 });
    },

    startTutorial() {
      const g = this.g;
      if (!g) return;
      const moves = g.findMoves().filter(m => !m.special && !m.drop);
      let pick = null;
      for (const m of moves) { const p = g.previewMove(m); if (p && p.t === 0) { pick = m; break; } }
      if (!pick) pick = g.bestMove();
      if (!pick) return;
      this.tut = { a: pick.a, b: pick.b };
      this.boardEl.classList.add('tut');
      [pick.a, pick.b].forEach(i => { const r = this.recAt(i); if (r) r.el.classList.add('tut-on'); });
      const hand = document.createElement('div');
      hand.className = 'hand'; hand.innerHTML = ico('i-hand');
      const C = this.cell, pa = this.xy(pick.a), pb = this.xy(pick.b);
      hand.style.setProperty('--hx0', (pa[0] + C * 0.3) + 'px'); hand.style.setProperty('--hy0', (pa[1] + C * 0.45) + 'px');
      hand.style.setProperty('--hx1', (pb[0] + C * 0.3) + 'px'); hand.style.setProperty('--hy1', (pb[1] + C * 0.45) + 'px');
      this.fxEl.appendChild(hand);
    },
    endTutorialPointer() {
      this.boardEl.classList.remove('tut');
      $$('.pc.tut-on').forEach(e => e.classList.remove('tut-on'));
      $$('.hand', this.fxEl).forEach(h => h.remove());
      this.tut = null;
    },

    outOfMoves() {
      this.busy = true;
      this.select(-1);
      openModal({
        html: '<div class="ribbon-h">Out of moves</div><h2>Not this time</h2><p class="lead" style="text-align:center">You ran out of moves before finishing the goal.</p><div class="actions"><button class="btn btn-red btn-xl" data-act="retry">Try again</button></div>',
        actions: { retry: (t, m) => { m.close(); Play.start(); } }
      });
    },

    async win() {
      this.busy = true;
      this.select(-1);
      await wait(this.T(1000));
      if (!this.g) return;
      if (this.g.moves > 0) {
        this.skipMode = true;
        const ph = this.g.celebrate();
        await this.play(ph);
        this.skipMode = false;
        this.skip = false;
        if (!this.g) return;
        this.hud(this.g.snapshot());
      }
      const g = this.g, stars = g.starsFor(g.score);
      openWin({ stars: stars });
    }
  };

  // Initialize and jump straight into Level 1
  Play.init();
  Play.start();

})();
</script>
</body></html>
