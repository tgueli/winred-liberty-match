  /* ==========================================================
     Coins, lives, boosters
     ========================================================== */
  function lifePeriod() { return (S.pass.active ? 15 : 30) * 60000; }
  function unlimited() { return S.unlimitedUntil > Date.now(); }
  function tickLives() {
    const now = Date.now();
    if (S.lives >= MAX_LIVES) { S.lifeClock = 0; return; }
    if (!S.lifeClock) S.lifeClock = now;
    const p = lifePeriod(), gained = Math.floor((now - S.lifeClock) / p);
    if (gained > 0) {
      S.lives = Math.min(MAX_LIVES, S.lives + gained);
      S.lifeClock = S.lives >= MAX_LIVES ? 0 : S.lifeClock + gained * p;
      save();
    }
  }
  function nextLifeMs() { return S.lives >= MAX_LIVES ? 0 : lifePeriod() - (Date.now() - S.lifeClock); }
  function canPlay() { tickLives(); return unlimited() || S.lives > 0; }
  function loseLife() {
    if (unlimited()) return;
    tickLives();
    if (S.lives >= MAX_LIVES) S.lifeClock = Date.now();
    S.lives = Math.max(0, S.lives - 1);
    save(); renderTop();
  }
  function refillLives() { S.lives = MAX_LIVES; S.lifeClock = 0; save(); renderTop(); }
  function addCoins(n, fromEl) { S.coins += n; save(); renderTop(); if (fromEl) flyCoins(fromEl); Sound.coin(); }
  function spendCoins(n) { if (S.coins < n) return false; S.coins -= n; save(); renderTop(); return true; }
  function completedCount() { return Object.keys(S.levels).length; }
  function nextLevelId() { for (const L of LEVELS) if (!S.levels[L.id]) return L.id; return null; }
  function isUnlocked(id) { return id === 1 || !!S.levels[id] || !!S.levels[id - 1]; }
  function dailyAvailable() { return S.daily.last !== dayKey(); }

  function goalTotals(L) {
    let seals = 0, crates = 0;
    (L.layout || []).forEach(row => { for (const ch of row) { if (ch === 's') seals += 1; if (ch === 'S') seals += 2; if (ch === 'c' || ch === 'C') crates += 1; } });
    return L.goals.map(g => ({ kind: g.kind, t: g.t, n: g.n || (g.kind === 'seal' ? seals : g.kind === 'crate' ? crates : 0) }));
  }
  function goalIconId(g, L) {
    if (g.kind === 'collect') return 'p-' + g.t;
    if (g.kind === 'seal') return 'i-seal';
    if (g.kind === 'crate') return 'crate-' + (L.crateSkin || 'tea');
    return 'drop-' + (L.dropSkin || 'cannon');
  }
  function goalText(g, L) {
    const n = g.n;
    if (g.kind === 'collect') return 'Collect ' + n + ' ' + (n === 1 ? PIECES[g.t].name : PIECES[g.t].plural);
    if (g.kind === 'seal') return 'Break ' + n + ' of the King’s seals';
    if (g.kind === 'crate') {
      const skin = L.crateSkin || 'tea';
      if (skin === 'ice') return 'Break ' + n + ' blocks of ice';
      if (skin === 'supply') return 'Break open ' + n + ' supply crates';
      return 'Toss ' + n + ' tea chests overboard';
    }
    const skin = L.dropSkin || 'cannon';
    if (skin === 'boat') return 'Bring ' + n + ' boats across the river';
    if (skin === 'scroll') return 'Carry ' + n + ' drafts to Congress';
    return 'Deliver ' + n + ' cannons to Boston';
  }

  /* ==========================================================

  function starPts(cx, cy, R, r) {
    const p = [];
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? r : R;
      p.push((cx + rad * Math.cos(a)).toFixed(2) + ',' + (cy + rad * Math.sin(a)).toFixed(2));
    }
    return p.join(' ');
  }
  function flagSVG(lit) {
    const sh = 100 / 13;

    for (let i = 0; i < 13; i++) s += '<rect x="0" y="' + (i * sh).toFixed(2) + '" width="190" height="' + (sh + 0.4).toFixed(2) + '" fill="' + (i % 2 ? '#fffdf7' : '#b22234') + '"/>';
    const ch = sh * 7;
    s += '<rect width="76" height="' + ch.toFixed(2) + '" fill="#1c2b4b"/>';
    const cx = 38, cy = ch / 2, rr = ch * 0.34;
    for (let k = 0; k < 13; k++) {
      const a = -Math.PI / 2 + k * 2 * Math.PI / 13, x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a), on = k < lit;
      s += '<polygon points="' + starPts(x, y, 3.9, 1.6) + '" fill="' + (on ? '#fffdf7' : 'none') + '" stroke="' + (on ? '#fffdf7' : 'rgba(255,253,247,.4)') + '" stroke-width="' + (on ? 0.5 : 0.7) + '"/>';
    }
    return s + '</svg>';
  }
  function buntingSVG() {
    let s = '<svg class="bunting" viewBox="0 0 390 66" preserveAspectRatio="xMidYMin meet" aria-hidden="true">';
    [65, 195, 325].forEach(x => {
      s += '<g transform="translate(' + x + ' 0)">';
      [[62, '#b22234'], [46, '#fffdf7'], [30, '#1c2b4b']].forEach(b => { s += '<path d="M' + (-b[0]) + ' 0 A' + b[0] + ' ' + b[0] + ' 0 0 0 ' + b[0] + ' 0 Z" fill="' + b[1] + '"/>'; });
      for (let k = 1; k < 8; k++) { const a = k * Math.PI / 8; s += '<path d="M0 0 L' + (62 * Math.cos(a)).toFixed(1) + ' ' + (62 * Math.sin(a)).toFixed(1) + '" stroke="rgba(0,0,0,.13)" stroke-width="1.5"/>'; }
      s += '<polygon points="' + starPts(0, 15, 7.5, 3.1) + '" fill="#fffdf7"/><circle cx="0" cy="0" r="6" fill="#c8962e"/></g>';
    });
    return s + '<path d="M0 1.5 H390" stroke="#86611a" stroke-width="3"/></svg>';
  }
  function sealSVG() {
    let d = '';
    for (let i = 0; i <= 90; i++) {
      const a = i / 90 * Math.PI * 2, r = 46 + 2.4 * Math.sin(a * 9) + 1.3 * Math.sin(a * 23 + 1);
      d += (i ? 'L' : 'M') + (50 + r * Math.cos(a)).toFixed(2) + ' ' + (50 + r * Math.sin(a)).toFixed(2);
    }
    return '<path d="' + d + 'Z" fill="#a51d2f" stroke="#6b1220" stroke-width="2"/>' +
      '<circle cx="50" cy="50" r="36" fill="#bf2a3d" stroke="#8f1a29" stroke-width="2"/>' +
      '<circle cx="50" cy="50" r="31" fill="none" stroke="#e8707e" stroke-width="1.5" stroke-dasharray="2.5 3"/>' +
      '<path d="M24 31 C29.5 25 36 22 44 21.5" fill="none" stroke="#ec8a96" stroke-width="3" stroke-linecap="round" opacity=".75"/>';
  }
  function coinPile(stacks) {
    let s = '<svg viewBox="0 0 64 64" aria-hidden="true">';
    const n = stacks.length, gap = n > 1 ? 40 / (n - 1) : 0;
    const base = 36 + (Math.max.apply(null, stacks) - 1) * 2.3;
    stacks.forEach((h, k) => {
      const x = n === 1 ? 32 : 12 + k * gap;
      for (let j = 0; j < h; j++) {
        const y = base - j * 4.6;
        s += '<ellipse cx="' + x + '" cy="' + (y + 1.8) + '" rx="10" ry="4" fill="#9a6d16"/><ellipse cx="' + x + '" cy="' + y + '" rx="10" ry="4" fill="#f2c14e" stroke="#7a5412" stroke-width="1.2"/>';
      }
    });
    return s + '</svg>';
  }

  const modalRoot = () => $('#modal-root');
  function modalOpen() { return !!modalRoot().children.length; }
  function openModal(o) {
    const back = document.createElement('div');
    back.className = 'backdrop' + (o.sheet ? ' sheet' : '');
    back.innerHTML = '<div class="modal ' + (o.cls || '') + '" role="dialog" aria-modal="true">' + o.html + '</div>';
    modalRoot().appendChild(back);
    const modal = back.firstElementChild;
    const api = {
      el: modal,
      closed: false,
      close() {
        if (api.closed) return;
        api.closed = true;
        back.remove();
        if (o.onClose) o.onClose();
      },
      set(html) { modal.innerHTML = html; }
    };
    back.addEventListener('click', e => {
      const t = e.target.closest('[data-act]');
      if (t && modal.contains(t)) {
        const fn = o.actions && o.actions[t.dataset.act];
        if (fn) { Sound.unlock(); Sound.click(); fn(t, api, e); }
        return;
      }
      if (e.target === back && o.dismiss) api.close();
    });
    const first = modal.querySelector('.btn');
    if (first) setTimeout(() => { try { first.focus({ preventScroll: true }); } catch (e) { first.focus(); } }, 60);
    return api;
  }
  function confirmBox(title, text, yes, no) {
    return new Promise(resolve => {
      openModal({
        html: '<h2>' + esc(title) + '</h2><p class="lead" style="text-align:center">' + esc(text) + '</p><div class="actions"><button class="btn btn-red btn-xl" data-act="yes">' + esc(yes) + '</button><button class="btn btn-ghost" data-act="no">' + esc(no) + '</button></div>',
        actions: { yes: (t, m) => { m.close(); resolve(true); }, no: (t, m) => { m.close(); resolve(false); } }
      });
    });
  }

  function drawRoad() {
    const road = $('#road');
    if (!road || $('#view-map').hidden) return;
    const svg = $('#road-line'), rb = road.getBoundingClientRect();
    const pts = $$('.stop .node', road).map(n => { const r = n.getBoundingClientRect(); return [r.left + r.width / 2 - rb.left, r.top + r.height / 2 - rb.top]; });
    if (pts.length < 2 || !rb.width) return;
    const pathTo = last => {
      let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
      for (let i = 1; i <= last; i++) {
        const a = pts[i - 1], b = pts[i], my = (a[1] + b[1]) / 2;
        d += ' C' + a[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + my.toFixed(1) + ' ' + b[0].toFixed(1) + ' ' + b[1].toFixed(1);
      }
      return d;
    };
    const all = pathTo(pts.length - 1), doneIdx = Math.min(completedCount(), pts.length - 1);
    svg.setAttribute('viewBox', '0 0 ' + rb.width.toFixed(0) + ' ' + rb.height.toFixed(0));
    svg.innerHTML = '<path d="' + all + '" fill="none" stroke="#dcc590" stroke-width="18" stroke-linecap="round"/>' +
      '<path d="' + all + '" fill="none" stroke="#a88a55" stroke-width="3.5" stroke-dasharray="2 12" stroke-linecap="round"/>' +
      (doneIdx > 0 ? '<path d="' + pathTo(doneIdx) + '" fill="none" stroke="#b22234" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>' : '');
  }

  function recordWin(id, stars, score) {
    const prev = S.levels[id], firstTime = !prev;
    let coins = 5;
    if (firstTime) coins = 20 + stars * 10;

    const newBest = !prev || score > prev.best;
    S.levels[id] = { stars: Math.max(stars, prev ? prev.stars : 0), best: Math.max(score, prev ? prev.best : 0) };
    S.coins += coins;
    save();
    return { firstTime: firstTime, coins: coins, stars: stars, score: score, newBest: newBest };

  function demoCheckout(item) {

      let done = false;

      const art = item.type === 'coins' ? coinPile(item.art) : item.type === 'sub' ? ico('i-medal') : ico('i-giftc');
      const what = item.type === 'coins' ? fmt(item.coins) + ' gold coins'
        : item.type === 'sub' ? '100 coins every day, faster lives, and a gold flag frame. Renews monthly.'
          : '1,000 coins, 3 of each booster, and 2 hours of unlimited lives';
      const price = money(item.price) + (item.type === 'sub' ? ' / month' : '');
      const view = state => {
        if (state === 'busy') return '<h2>Processing…</h2><div class="spinner" aria-label="Processing"></div><p class="goal-moves">Practice checkout, no money is moving.</p>';
        if (state === 'ok') return ico('i-check', 'big-ico') + '<h2>Thank you!</h2><p class="lead" style="text-align:center">' + esc(item.name) + ' has been added to your game.</p>';
        return '<div class="ribbon-h">Confirm purchase</div>' +
          '<div class="checkout-item">' + art + '<div><b>' + esc(item.name) + '</b><span>' + esc(what) + '</span></div></div>' +
          '<div class="price-big">' + price + '</div>' +
          '<div class="demo-note"><b>Demo store.</b> This is a practice checkout. No real money will be charged, and no card is needed.</div>' +
          '<div class="actions"><button class="btn btn-green btn-xl" data-act="buy">Buy for ' + price + '</button><button class="btn btn-ghost" data-act="cancel">Cancel</button></div>';
      };
      const m = openModal({
        sheet: true,
        html: view(),
        onClose: () => finish({ ok: false }),
        actions: {
          buy: async (t, mm) => {
            mm.set(view('busy'));
            await wait(900);
            mm.set(view('ok'));
            Sound.coin();
            await wait(1000);
            finish({ ok: true, receipt: { id: 'demo-' + Date.now().toString(36), sku: item.sku, price: item.price, at: Date.now() } });
            mm.close();
          },
          cancel: (t, mm) => { finish({ ok: false }); mm.close(); }
        }
      });
    });

    if (item.unlimitedHours) S.unlimitedUntil = Math.max(Date.now(), S.unlimitedUntil) + item.unlimitedHours * 3600000;
    if (item.type === 'bundle') S.bundle = true;
    if (item.type === 'sub') { S.pass.active = true; S.pass.since = Date.now(); }
    save(); renderTop(); Play.renderBoosters();

  /* ==========================================================
     The board: rendering, input, animation
     ========================================================== */
  function pieceClass(c) {
    return 'pc' + (c.k === 'd' ? ' drop' : c.k === 'c' ? ' crate' : '') + (c.s ? ' sp-' + c.s : '');
  }
  function pieceHTML(c, skins) {
    if (c.k === 'c') return ico('crate-' + skins.crate + (c.hp > 1 ? '-2' : ''), 'ic');
    if (c.k === 'd') return ico('drop-' + skins.drop, 'ic') + '<span class="badge">' + ico('i-down') + '</span>';
    if (c.s === 'bell') return '<span class="rays"></span>' + ico('p-bell', 'ic');
    let h = ico('p-' + c.t, 'ic');
    if (c.s === 'row' || c.s === 'col') h += ico('ov-arrow', 'ov');
    else if (c.s === 'keg') h += ico('ov-keg', 'ov');
    return h;
  }
  const pieceKey = c => c.k + ':' + c.t + ':' + (c.s || '') + ':' + (c.hp || 0);

  const SPECIAL_TIPS = {
    row: { title: 'You made a Rocket!', text: 'Swap it with any piece next to it and it fires across the board. The arrows show which way it goes.' },
    keg: { title: 'You made a Powder Keg!', text: 'Swap it with any piece next to it to blast away everything around it.' },
    bell: { title: 'You made the Liberty Bell!', text: 'Swap it with any piece to clear every piece of that kind. Fun fact: it got the name Liberty Bell in the 1830s, when people working to end slavery took it as their symbol.' }
  };

  const Play = {
    g: null, L: null, cell: 40, els: new Map(), busy: false, sel: -1, booster: null, tut: null,
    hintT: 0, continues: 0, skip: false, skipMode: false, pendingTips: [], lowWarned: false, skins: { crate: 'tea', drop: 'cannon' },
    prevGot: null, badSwaps: 0, blockNoted: false, bubbleResolve: null, displayMoves: 0,

    init() {
      this.boardEl = $('#board');
      this.piecesEl = $('#pieces');
      this.tilesEl = $('#tiles');
      this.fxEl = $('#fx');
      this.bindInput();
      $('#bubble-slot').addEventListener('click', e => {
        const b = e.target.closest('[data-bub]');
        if (!b) return;
        Sound.click();
        const r = this.bubbleResolve;
        this.bubbleResolve = null;
        this.blocking = false;
        $('#bubble-slot').innerHTML = '';
        if (r) r(b.dataset.bub);
      });
      window.addEventListener('resize', () => { if (this.g && !$('#scr-game').hidden) this.layout(true); });
    },
    T(ms) { return this.skip ? Math.min(ms, 10) : ms * (SPEEDS[S.settings.speed] || 1); },

    start(id) {
      const L = LEVELS[id - 1];
      this.stop();
      this.L = L;
      this.g = new Engine.Game(L);
      this.skins = { crate: L.crateSkin || 'tea', drop: L.dropSkin || 'cannon' };
      this.sel = -1; this.booster = null; this.tut = null; this.continues = 0;
      this.skip = false; this.skipMode = false; this.busy = false; this.lowWarned = false;
      this.pendingTips = []; this.badSwaps = 0; this.blockNoted = false; this.prevGot = null;
      $('#g-lv').textContent = 'Level ' + id + ' of 13';
      $('#g-nm').textContent = L.title;
      this.boardEl.classList.remove('tut');
      showScreen('game');
      this.renderBoosters();
      this.layout(false);
      this.renderPieces();
      this.hud(this.g.snapshot(), true);
      Sound.drumroll();
      if (id === 1 && !S.seen.tut) setTimeout(() => this.startTutorial(), 380);
      else if (L.tip && !S.seen.tips[id]) setTimeout(() => this.showTip(L.tip, id), 420);
      else this.armHint();
    },
    stop() {
      this.clearHint();
      this.clearBubble();
      this.g = null;
      this.busy = false;
      this.booster = null;
      if (this.piecesEl) { this.piecesEl.innerHTML = ''; this.fxEl.innerHTML = ''; }
      this.els.clear();
    },

    /* ----- Layout ----- */
    layout(reposition) {
      const wrap = $('#board-wrap'), cs = getComputedStyle(wrap);
      const w = wrap.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const h = wrap.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      const cols = this.g.cols, rows = this.g.rows;
      const cell = Math.max(26, Math.floor(Math.min(w / cols, h / rows)));
      this.cell = cell;
      this.boardEl.style.width = cell * cols + 'px';
      this.boardEl.style.height = cell * rows + 'px';
      this.boardEl.style.setProperty('--cell', cell + 'px');
      this.renderTiles();
      if (reposition) {
        this.els.forEach(rec => { rec.el.style.transition = 'none'; const p = this.xy(rec.cell); rec.el.style.transform = 'translate3d(' + p[0] + 'px,' + p[1] + 'px,0)'; });
      }
    },
    xy(i) { return [(i % this.g.cols) * this.cell, Math.floor(i / this.g.cols) * this.cell]; },
    dist(a, b) { const c = this.g.cols; return Math.abs((a / c | 0) - (b / c | 0)) + Math.abs(a % c - b % c); },
    renderTiles(seals) {
      const g = this.g, sl = seals || g.seals;
      let h = '';
      for (let i = 0; i < g.n; i++) {
        const r = (i / g.cols) | 0, c = i % g.cols, p = this.xy(i);
        h += '<div class="tile' + ((r + c) % 2 ? ' alt' : '') + (sl[i] ? ' seal' + Math.min(2, sl[i]) : '') + '" style="transform:translate(' + p[0] + 'px,' + p[1] + 'px)">' + (sl[i] ? ico('i-crown') : '') + '</div>';
      }
      this.tilesEl.innerHTML = h;
    },
    updateTile(i, level, anim) {
      const t = this.tilesEl.children[i];
      if (!t) return;
      const r = (i / this.g.cols) | 0, c = i % this.g.cols;
      t.className = 'tile' + ((r + c) % 2 ? ' alt' : '') + (level ? ' seal' + Math.min(2, level) : '');
      t.innerHTML = level ? ico('i-crown') : '';
      if (anim) { void t.offsetWidth; t.classList.add('crack'); }
    },
    renderPieces() {
      this.piecesEl.innerHTML = '';
      this.fxEl.innerHTML = '';
      this.els.clear();
      this.g.cells.forEach((c, i) => { if (c) this.createEl(c, i, null); });
    },
    createEl(c, i, fromRow) {
      const el = document.createElement('div');
      el.className = pieceClass(c);
      el.innerHTML = pieceHTML(c, this.skins);
      const rec = { el: el, key: pieceKey(c), cell: i };
      this.els.set(c.id, rec);
      this.piecesEl.appendChild(el);
      const p = this.xy(i);
      if (fromRow != null) {
        el.style.transition = 'none';
        el.style.transform = 'translate3d(' + p[0] + 'px,' + (fromRow * this.cell) + 'px,0)';
      } else {
        el.style.transform = 'translate3d(' + p[0] + 'px,' + p[1] + 'px,0)';
      }
      return rec;
    },
    recAt(i) { for (const rec of this.els.values()) if (rec.cell === i) return rec; return null; },
    moveEl(rec, i, dur, easing) {
      const p = this.xy(i);
      rec.el.style.transition = dur ? 'transform ' + dur + 'ms ' + (easing || 'ease-in-out') : 'none';
      rec.el.style.transform = 'translate3d(' + p[0] + 'px,' + p[1] + 'px,0)';
    },
    /* Bring the DOM in line with a snapshot; returns the longest move time */
    sync(snap, opts) {
      opts = opts || {};
      const seen = new Set(), fresh = [];
      let maxT = 0;
      snap.cells.forEach((c, i) => {
        if (!c) return;
        seen.add(c.id);
        let rec = this.els.get(c.id);
        if (!rec) {
          const from = opts.spawns && opts.spawns.has(c.id) ? opts.spawns.get(c.id) : null;
          rec = this.createEl(c, i, from);
          if (from != null) fresh.push({ rec: rec, i: i, d: ((i / this.g.cols) | 0) - from });
          return;
        }
        const key = pieceKey(c);
        if (key !== rec.key) { rec.el.className = pieceClass(c); rec.el.innerHTML = pieceHTML(c, this.skins); rec.key = key; }
        if (rec.cell !== i) {
          const d = this.dist(rec.cell, i);
          const t = opts.dur != null ? opts.dur : this.T(110 + 60 * d);
          this.moveEl(rec, i, t, opts.dur != null ? 'ease-in-out' : 'cubic-bezier(.45,.05,.6,1.08)');
          rec.cell = i;
          maxT = Math.max(maxT, t);
        }
      });
      if (fresh.length) {
        void this.piecesEl.offsetWidth;
        fresh.forEach(f => {
          const t = this.T(110 + 60 * f.d);
          this.moveEl(f.rec, f.i, t, 'cubic-bezier(.45,.05,.6,1.08)');
          maxT = Math.max(maxT, t);
        });
      }
      this.els.forEach((rec, id) => { if (!seen.has(id)) { rec.el.remove(); this.els.delete(id); } });
      return maxT;
    },

    /* ----- Heads-up display ----- */
    goalIcon(g) { return goalIconId(g, this.L); },
    hud(snap, first) {
      const L = this.L;
      const mv = snap.moves;
      $('#hud-moves-n').textContent = mv;
      this.displayMoves = mv;
      const playing = this.g && this.g.state === 'play';
      $('#hud-moves').classList.toggle('low', mv <= 5 && mv > 0 && playing);
      if (mv === 5 && !this.lowWarned && playing && !first) { this.lowWarned = true; toast('Only 5 moves left!'); }
      $('#score-n').textContent = fmt(snap.score);
      const max = L.stars[2] * 1.12;
      $('#sb-fill').style.width = Math.min(100, snap.score / max * 100).toFixed(1) + '%';
      const track = $('#sb-track');
      if (first) {
        $$('.sb-star', track).forEach(e => e.remove());
        [1, 2].forEach(k => {
          const s = document.createElement('div');
          s.className = 'sb-star';
          s.dataset.k = k;
          s.style.left = (L.stars[k] / max * 100).toFixed(1) + '%';
          s.innerHTML = ico('i-star');
          track.appendChild(s);
        });
      }
      $$('.sb-star', track).forEach(s => s.classList.toggle('on', snap.score >= L.stars[+s.dataset.k]));
      const box = $('#hud-goals');
      if (first || !this.prevGot) {
        box.innerHTML = snap.goals.map((g, k) => '<div class="goal' + (g.got >= g.n ? ' done' : '') + '" data-k="' + k + '" aria-label="' + esc(goalText(g, L)) + '"><span class="gi">' + ico(this.goalIcon(g)) + '</span><span class="n">' + (g.n - g.got) + '</span>' + ico('i-check', 'ck') + '</div>').join('');
      } else {
        snap.goals.forEach((g, k) => {
          const el = box.children[k];
          if (!el) return;
          if (g.got !== this.prevGot[k]) {
            el.querySelector('.n').textContent = Math.max(0, g.n - g.got);
            el.classList.toggle('done', g.got >= g.n);
            el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
          }
        });
      }
      this.prevGot = snap.goals.map(g => g.got);
    },
    renderBoosters() {
      ['gavel', 'cannon', 'shuffle'].forEach(k => {
        const el = $('#bc-' + k);
        if (!el) return;
        const n = S.boosters[k];
        el.textContent = n > 0 ? n : '+';
        el.classList.toggle('buy', n <= 0);
      });
      $$('.booster').forEach(b => b.classList.toggle('armed', b.dataset.b === this.booster));
    },

    /* ----- Input ----- */
    bindInput() {
      const b = this.boardEl;
      let start = null;
      b.addEventListener('pointerdown', e => {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        Sound.unlock();
        if (this.skipMode) { this.skip = true; return; }
        if (this.busy || !this.g || modalOpen()) return;
        if (this.blocking) { this.nudgeBubble(); return; }
        const i = this.cellAt(e);
        if (i < 0) return;
        start = { i: i, x: e.clientX, y: e.clientY, id: e.pointerId, moved: false };
        try { b.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      });
      b.addEventListener('pointermove', e => {
        if (!start || start.moved || e.pointerId !== start.id || this.booster) return;
        const dx = e.clientX - start.x, dy = e.clientY - start.y, th = this.cell * 0.38;
        if (Math.abs(dx) < th && Math.abs(dy) < th) return;
        start.moved = true;
        const cols = this.g.cols, r = (start.i / cols) | 0, c = start.i % cols;
        let t = -1;
        if (Math.abs(dx) > Math.abs(dy)) { if (dx > 0 && c < cols - 1) t = start.i + 1; else if (dx < 0 && c > 0) t = start.i - 1; }
        else if (dy > 0 && r < this.g.rows - 1) t = start.i + cols;
        else if (dy < 0 && r > 0) t = start.i - cols;
        if (t >= 0) { const a = start.i; this.select(-1); this.attempt(a, t); }
      });
      b.addEventListener('pointerup', e => {
        if (!start || e.pointerId !== start.id) return;
        const s = start;
        start = null;
        if (!s.moved) this.tap(s.i);
      });
      b.addEventListener('pointercancel', () => { start = null; });
    },
    cellAt(e) {
      const r = this.boardEl.getBoundingClientRect();
      const c = Math.floor((e.clientX - r.left) / this.cell), row = Math.floor((e.clientY - r.top) / this.cell);
      if (c < 0 || row < 0 || c >= this.g.cols || row >= this.g.rows) return -1;
      return row * this.g.cols + c;
    },
    tap(i) {
      this.clearHint();
      if (this.booster) { this.applyBooster(i); return; }
      if (!this.g || this.g.state !== 'play') return;
      if (this.tut && i !== this.tut.a && i !== this.tut.b) { this.nudgeBubble(); return; }
      const c = this.g.cells[i];
      if (this.sel < 0) {
        if (!c) return;
        if (c.k === 'c') { this.nope(i); return; }
        this.select(i); Sound.select(); this.armHint();
        return;
      }
      if (i === this.sel) { this.select(-1); this.armHint(); return; }
      if (this.g.adjacent(this.sel, i)) { const a = this.sel; this.select(-1); this.attempt(a, i); return; }
      if (c && c.k === 'c') { this.nope(i); return; }
      this.select(i); Sound.select(); this.armHint();
    },
    select(i) {
      if (this.sel >= 0) { const r = this.recAt(this.sel); if (r) r.el.classList.remove('sel'); }
      this.sel = i;
      if (i >= 0) { const r = this.recAt(i); if (r) r.el.classList.add('sel'); }
    },
    nope(i) {
      const rec = this.recAt(i);
      if (rec) { rec.el.classList.remove('nope'); void rec.el.offsetWidth; rec.el.classList.add('nope'); }
      Sound.bad();
      if (!this.blockNoted) {
        this.blockNoted = true;
        const s = this.skins.crate;
        toast((s === 'ice' ? 'Ice' : s === 'supply' ? 'Crates' : 'Tea chests') + ' can’t be moved. Make a match right next to them instead.', 3200);
      }
    },
    async attempt(a, b) {
      if (this.busy || !this.g || this.g.state !== 'play') return;
      this.clearHint();
      if (this.tut && !((a === this.tut.a && b === this.tut.b) || (a === this.tut.b && b === this.tut.a))) { this.nudgeBubble(); return; }
      const res = this.g.trySwap(a, b);
      if (!res.ok) {
        if (res.reason === 'nomatch') {
          this.busy = true;
          await this.play(res.phases);
          this.busy = false;
          this.badSwaps++;
          if (this.badSwaps === 2) toast('A swap has to line up 3 of the same kind.', 3000);
        } else if (res.reason === 'blocked') {
          const ca = this.g.cells[a];
          this.nope(ca && ca.k === 'c' ? a : b);
        }
        this.armHint();
        return;
      }
      this.badSwaps = 0;
      this.busy = true;
      const wasTut = !!this.tut;
      if (wasTut) this.endTutorialPointer();
      await this.play(res.phases);
      this.busy = false;
      if (!this.g) return;
      if (wasTut) await this.tutorialDone();
      await this.afterMove();
    },
    async afterMove() {
      if (!this.g) return;
      while (this.pendingTips.length && this.g && this.g.state === 'play') {
        const k = this.pendingTips.shift();
        if (S.seen.sp[k]) continue;
        S.seen.sp[k] = true; save();
        await this.bubble({ title: SPECIAL_TIPS[k].title, text: SPECIAL_TIPS[k].text, buttons: [{ id: 'ok', label: 'Got it' }], block: true });
      }
      if (!this.g) return;
      if (this.g.state === 'won') return this.win();
      if (this.g.state === 'lost') return this.outOfMoves();
      this.armHint();
    },
    noteSpecial(kind) {
      const k = kind === 'col' ? 'row' : kind;
      if (!S.seen.sp[k] && this.pendingTips.indexOf(k) < 0) this.pendingTips.push(k);
    },

    /* ----- Playing back the engine's phases ----- */
    async play(phases) {
      if (!phases) return;
      for (const ph of phases) {
        if (!this.g) return;
        if (ph.kind === 'swap') { Sound.swap(); await wait(this.sync(ph.snap, { dur: this.T(180) })); }
        else if (ph.kind === 'swapBack') await this.animSwapBack(ph);
        else if (ph.kind === 'clear') await this.animClear(ph);
        else if (ph.kind === 'fall') await wait(this.sync(ph.snap, { spawns: new Map(ph.spawns.map(s => [s.id, s.fromRow])) }) + 10);
        else if (ph.kind === 'deliver') await this.animDeliver(ph);
        else if (ph.kind === 'shuffle') await this.animShuffle(ph);
        else if (ph.kind === 'convert') await this.animConvert(ph);
        if (this.g) this.hud(ph.snap);
      }
    },
    async animSwapBack(ph) {
      const ra = this.recAt(ph.a), rb = this.recAt(ph.b);
      if (!ra || !rb) return;
      const d = this.T(150);
      Sound.swap();
      this.moveEl(ra, ph.b, d); this.moveEl(rb, ph.a, d);
      await wait(d + 20);
      Sound.bad();
      this.moveEl(ra, ph.a, d); this.moveEl(rb, ph.b, d);
      await wait(d + 20);
    },
    async animClear(ph) {
      let origin = -1, big = false, rocket = false, boom = false, bell = false, match = false;
      ph.fx.forEach(f => {
        if (f.fx === 'match') { match = true; return; }
        if (origin < 0) origin = f.at;
        this.drawFx(f);
        if (/^(row|col|cross|bigcross|cannon)$/.test(f.fx)) rocket = true;
        if (/^(keg|bigkeg|all|cannon)$/.test(f.fx)) boom = true;
        if (/^(bell|ring|all)$/.test(f.fx)) bell = true;
        if (f.fx === 'gavel') Sound.gavel();
        if (/^(bigkeg|all|bigcross|cross)$/.test(f.fx)) big = true;
      });
      if (match) Sound.pop(ph.mult || 1);
      if (rocket) Sound.rocket();
      if (boom) Sound.boom();
      if (bell) Sound.bell();
      if (big) this.shake();
      let maxDelay = 0, crateGone = false;
      ph.removed.forEach(r => {
        const rec = this.els.get(r.id);
        if (!rec) return;
        let delay = 0;
        if (origin >= 0) { delay = this.T(this.dist(origin, r.i) * 28); maxDelay = Math.max(maxDelay, delay); }
        if (r.k === 'c') { crateGone = true; this.burst(r.i, this.skins.crate === 'ice' ? ['#bfe3f3', '#ffffff', '#6ea8c6'] : ['#b7793b', '#e3c08c', '#6b4423']); }
        const el = rec.el;
        if (delay) setTimeout(() => el.classList.add('pop'), delay); else el.classList.add('pop');
      });
      if (crateGone) Sound.crate();
      ph.sealsHit.forEach(i => { this.updateTile(i, ph.snap.seals[i], true); this.burst(i, ['#c0392f', '#f2c14e', '#fff3dc']); });
      if (ph.sealsHit.length) Sound.seal();
      ph.fx.forEach(f => { if (f.pts > 0 && f.fx !== 'ring') this.popup(f.at, '+' + fmt(f.pts)); });
      await wait(this.T(250) + maxDelay);
      ph.removed.forEach(r => { const rec = this.els.get(r.id); if (rec) { rec.el.remove(); this.els.delete(r.id); } });
      this.sync(ph.snap, { dur: 0 });
      if (ph.cratesHit.length) {
        Sound.crate();
        ph.cratesHit.forEach(i => { const rec = this.recAt(i); if (rec) { rec.el.classList.remove('hit'); void rec.el.offsetWidth; rec.el.classList.add('hit'); } });
      }
      if (ph.made.length) {
        Sound.made();
        ph.made.forEach(m => {
          const rec = this.els.get(m.id);
          if (rec) { rec.el.classList.remove('made'); void rec.el.offsetWidth; rec.el.classList.add('made'); }
          this.noteSpecial(m.s);
        });
        await wait(this.T(230));
      }
    },
    async animDeliver(ph) {
      Sound.deliver();
      ph.removed.forEach(r => {
        const rec = this.els.get(r.id);
        if (rec) rec.el.classList.add('deliver');
        this.popup(r.i, '+300');
        this.burst(r.i, ['#2e7d4f', '#f2c14e', '#ffffff']);
      });
      await wait(this.T(580));
      ph.removed.forEach(r => { const rec = this.els.get(r.id); if (rec) { rec.el.remove(); this.els.delete(r.id); } });
    },
    async animShuffle(ph) {
      Sound.shuffle();
      this.banner('Shuffling the board', 'No more matches were left', this.T(1100));
      await wait(this.T(350));
      const t = this.sync(ph.snap, { dur: this.T(520) });
      await wait(Math.max(t, this.T(700)));
    },
    async animConvert(ph) {
      const step = this.T(ph.celebrate ? 110 : 70);
      let shown = this.displayMoves;
      for (const i of ph.cells) {
        const c = ph.snap.cells[i];
        const rec = c && this.els.get(c.id);
        if (rec) {
          rec.el.className = pieceClass(c);
          rec.el.innerHTML = pieceHTML(c, this.skins);
          rec.key = pieceKey(c);
          rec.el.classList.add('made');
        }
        Sound.select();
        if (ph.celebrate && shown > 0) { shown--; $('#hud-moves-n').textContent = shown; this.popup(i, '+100'); }
        await wait(step);
      }
      this.sync(ph.snap, { dur: 0 });
    },

    /* ----- Effects ----- */
    fxDiv(cls, style, life) {
      const d = document.createElement('div');
      d.className = cls;
      d.style.cssText = style;
      this.fxEl.appendChild(d);
      setTimeout(() => d.remove(), life || 900);
      return d;
    },
    drawFx(f) {
      const C = this.cell, cols = this.g.cols, rows = this.g.rows, p = this.xy(f.at), r = (f.at / cols) | 0, c = f.at % cols;
      const beamH = (row, extra) => this.fxDiv('beam h' + (extra || ''), 'left:0;top:' + (row * C + C * 0.33) + 'px;width:' + (cols * C) + 'px;height:' + (C * 0.34) + 'px;transform-origin:' + (p[0] + C / 2) + 'px 50%');
      const beamV = col => this.fxDiv('beam v', 'top:0;left:' + (col * C + C * 0.33) + 'px;height:' + (rows * C) + 'px;width:' + (C * 0.34) + 'px;transform-origin:50% ' + (p[1] + C / 2) + 'px');
      const blast = rad => { const s = (rad * 2 + 1) * C; this.fxDiv('blast', 'left:' + (p[0] + C / 2 - s / 2) + 'px;top:' + (p[1] + C / 2 - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px'); };
      switch (f.fx) {
        case 'row': beamH(r); break;
        case 'col': beamV(c); break;
        case 'cross': beamH(r); beamV(c); break;
        case 'bigcross':
          for (let d = -1; d <= 1; d++) { if (r + d >= 0 && r + d < rows) beamH(r + d); if (c + d >= 0 && c + d < cols) beamV(c + d); }
          break;
        case 'keg': blast(1); break;
        case 'bigkeg': blast(2); break;
        case 'cannon': beamH(r, ' cannon'); break;
        case 'bell': case 'ring': case 'all': this.bellFx(f); break;
        case 'gavel': this.flash(f.at, 1.5); this.burst(f.at, ['#c48a4f', '#f2c14e', '#fff3dc']); break;
        default: break;
      }
    },
    bellFx(f) {
      const C = this.cell, p = this.xy(f.at), cx = p[0] + C / 2, cy = p[1] + C / 2;
      let s = '<svg class="bell-lines" viewBox="0 0 ' + (this.g.cols * C) + ' ' + (this.g.rows * C) + '" aria-hidden="true">';
      (f.cells || []).forEach(t => {
        if (t === f.at) return;
        const q = this.xy(t);
        s += '<line x1="' + cx + '" y1="' + cy + '" x2="' + (q[0] + C / 2) + '" y2="' + (q[1] + C / 2) + '"/>';
      });
      const wrap = this.fxDiv('', 'position:absolute;left:0;top:0;right:0;bottom:0', 800);
      wrap.innerHTML = s + '</svg>';
      this.flash(f.at, f.fx === 'all' ? 7 : 2.4);
    },
    flash(i, size) {
      const C = this.cell, p = this.xy(i), s = C * size;
      this.fxDiv('flash', 'left:' + (p[0] + C / 2 - s / 2) + 'px;top:' + (p[1] + C / 2 - s / 2) + 'px;width:' + s + 'px;height:' + s + 'px', 600);
    },
    burst(i, colors) {
      if (REDUCED) return;
      const C = this.cell, p = this.xy(i);
      for (let k = 0; k < 7; k++) {
        const a = Math.random() * Math.PI * 2, d = C * (0.5 + Math.random() * 0.7);
        this.fxDiv('spark', 'left:' + (p[0] + C / 2 - 4) + 'px;top:' + (p[1] + C / 2 - 4) + 'px;background:' + colors[k % colors.length] + ';--dx:' + (Math.cos(a) * d).toFixed(0) + 'px;--dy:' + (Math.sin(a) * d).toFixed(0) + 'px', 850);
      }
    },
    popup(i, text) {
      const C = this.cell, p = this.xy(i);
      const d = this.fxDiv('pts', 'left:' + (p[0] + C / 2) + 'px;top:' + (p[1] + C / 2) + 'px', 950);
      d.textContent = text;
    },
    shake() {
      if (REDUCED) return;
      this.boardEl.classList.remove('shake');
      void this.boardEl.offsetWidth;
      this.boardEl.classList.add('shake');
    },
    banner(title, sub, ms) {
      const old = $('.banner', $('#board-wrap'));
      if (old) old.remove();
      const b = document.createElement('div');
      b.className = 'banner';
      b.setAttribute('role', 'status');
      b.innerHTML = esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '');
      $('#board-wrap').appendChild(b);
      setTimeout(() => b.remove(), ms || 1200);
    },

    /* ----- Hints ----- */
    armHint() {
      this.clearHint();
      if (!S.settings.hints || !this.g || this.g.state !== 'play') return;
      this.hintT = setTimeout(() => this.showHint(), 5500);
    },
    showHint() {
      if (this.busy || !this.g || this.g.state !== 'play' || modalOpen() || this.booster || this.tut || $('#scr-game').hidden) return;
      const m = this.g.bestMove();
      if (!m) return;
      [m.a, m.b].forEach(i => { const r = this.recAt(i); if (r) r.el.classList.add('hint'); });
    },
    clearHint() {
      clearTimeout(this.hintT);
      $$('.pc.hint').forEach(e => e.classList.remove('hint'));
    },

    /* ----- Guide bubbles and the first-level tutorial ----- */
    bubble(o) {
      if (this.bubbleResolve) { const prev = this.bubbleResolve; this.bubbleResolve = null; prev('replaced'); }
      this.blocking = !!o.block;
      return new Promise(resolve => {
        this.bubbleResolve = resolve;
        const btns = (o.buttons || []).map(b => '<button class="btn ' + (b.cls || 'btn-red') + '" data-bub="' + b.id + '">' + esc(b.label) + '</button>').join('');
        if (o.mini) {
          $('#bubble-slot').innerHTML = '<div class="bubble mini" role="status"><p>' + esc(o.text) + '</p>' + btns + '</div>';
          return;
        }
        $('#bubble-slot').innerHTML = '<div class="bubble' + (o.top ? ' top' : '') + '" role="status">' + ico('crier', 'crier') + '<div><b>' + esc(o.title) + '</b><p>' + esc(o.text) + '</p>' + (btns ? '<div class="row">' + btns + '</div>' : '') + '</div></div>';
      });
    },
    clearBubble() {
      const s = $('#bubble-slot');
      if (s) s.innerHTML = '';
      this.blocking = false;
      const r = this.bubbleResolve;
      this.bubbleResolve = null;
      if (r) r('cleared');
    },
    nudgeBubble() {
      const b = $('.bubble');
      if (!b) return;
      b.classList.remove('nudge'); void b.offsetWidth; b.classList.add('nudge');
      Sound.bad();
    },
    showTip(text, id) {
      this.bubble({ title: 'Hear ye, hear ye!', text: text, buttons: [{ id: 'ok', label: 'Got it' }], block: true }).then(() => {
        S.seen.tips[id] = true; save(); this.armHint();
      });
    },
    startTutorial() {
      const g = this.g;
      if (!g) return;
      const moves = g.findMoves().filter(m => !m.special && !m.drop);
      let pick = null, pv = null;
      for (const m of moves) { const p = g.previewMove(m); if (p && p.t === 0) { pick = m; pv = p; break; } }
      if (!pick) { pick = g.bestMove(); pv = pick ? g.previewMove(pick) : null; }
      if (!pick) { this.armHint(); return; }
      this.tut = { a: pick.a, b: pick.b };
      this.boardEl.classList.add('tut');
      [pick.a, pick.b].forEach(i => { const r = this.recAt(i); if (r) r.el.classList.add('tut-on'); });
      const hand = document.createElement('div');
      hand.className = 'hand';
      hand.innerHTML = ico('i-hand');
      const C = this.cell, pa = this.xy(pick.a), pb = this.xy(pick.b);
      hand.style.setProperty('--hx0', (pa[0] + C * 0.3) + 'px');
      hand.style.setProperty('--hy0', (pa[1] + C * 0.45) + 'px');
      hand.style.setProperty('--hx1', (pb[0] + C * 0.3) + 'px');
      hand.style.setProperty('--hy1', (pb[1] + C * 0.45) + 'px');
      this.fxEl.appendChild(hand);
      const what = pv && pv.t === 0 ? '3 drums' : '3 of a kind';
      const lowRow = Math.min((pick.a / g.cols) | 0, (pick.b / g.cols) | 0);
      this.bubble({ title: 'Hear ye, hear ye!', text: 'Tap a glowing piece, then tap the other one. They swap places and line up ' + what + '.', buttons: [], top: lowRow >= 3 });
    },
    endTutorialPointer() {
      this.boardEl.classList.remove('tut');
      $$('.pc.tut-on').forEach(e => e.classList.remove('tut-on'));
      $$('.hand', this.fxEl).forEach(h => h.remove());
      this.clearBubble();
      this.tut = null;
    },
    async tutorialDone() {
      S.seen.tut = true; save();
      const g0 = this.L.goals[0];
      await this.bubble({ title: 'Huzzah! Well done!', text: 'Keep matching until you collect all ' + g0.n + ' drums. Your goal and your moves are at the top of the screen.', buttons: [{ id: 'ok', label: 'Got it' }], block: true });
    },

    /* ----- Boosters ----- */
    onBooster(k) {
      if (this.busy || !this.g || this.g.state !== 'play') return;
      if (this.tut || this.blocking) { this.nudgeBubble(); return; }
      this.clearHint(); this.select(-1);
      if (this.booster === k) { this.cancelBooster(); return; }
      if (S.boosters[k] <= 0) { openBuyBooster(k, () => this.renderBoosters()); return; }
      Sound.select();
      if (k === 'shuffle') { this.useShuffle(); return; }
      this.booster = k;
      this.renderBoosters();
      this.bubble({
        mini: true,
        text: k === 'gavel' ? 'Tap any piece to knock it out.' : 'Tap any row to fire the cannon across it.',
        buttons: [{ id: 'cancel', label: 'Cancel', cls: 'btn-ghost' }]
      }).then(id => { if (id === 'cancel') this.cancelBooster(); });
    },
    cancelBooster() { this.booster = null; this.renderBoosters(); this.clearBubble(); this.armHint(); },
    async applyBooster(i) {
      const k = this.booster, c = this.g.cells[i];
      if (k === 'gavel' && (!c || c.k === 'd')) { toast('The Gavel can’t hit that one. Pick another piece.'); return; }
      this.booster = null;
      this.clearBubble();
      const res = k === 'gavel' ? this.g.useGavel(i) : this.g.useCannon((i / this.g.cols) | 0);
      this.renderBoosters();
      if (!res.ok) { this.armHint(); return; }
      S.boosters[k]--; save(); this.renderBoosters();
      this.busy = true;
      await this.play(res.phases);
      this.busy = false;
      await this.afterMove();
    },
    async useShuffle() {
      const res = this.g.useShuffle();
      if (!res.ok) return;
      S.boosters.shuffle--; save(); this.renderBoosters();
      this.busy = true;
      Sound.shuffle();
      await wait(this.sync(res.phases[res.phases.length - 1].snap, { dur: this.T(520) }));
      this.busy = false;
      this.armHint();
    },

    /* ----- Level end ----- */
    async win() {
      this.busy = true;
      this.clearHint(); this.select(-1); this.clearBubble();
      Sound.star(2);
      this.banner('Huzzah!', 'Goal complete', this.T(1500));
      await wait(this.T(1500));
      if (!this.g) return;
      if (this.g.moves > 0) {
        this.banner('Liberty fireworks!', 'Every move you saved becomes a firework', this.T(1600));
        await wait(this.T(1600));
        this.skipMode = true;
        const note = document.createElement('div');
        note.className = 'skip-note';
        note.textContent = 'Tap the board to skip';
        $('#board-wrap').appendChild(note);
        const ph = this.g.celebrate();
        await this.play(ph);
        note.remove();
        this.skipMode = false;
        this.skip = false;
        if (!this.g) return;
        this.hud(this.g.snapshot());
      }
      const g = this.g, stars = g.starsFor(g.score);
      const res = recordWin(this.L.id, stars, g.score);
      Sound.fanfare();
      openWin(this.L, res);
    },
    outOfMoves() {
      this.busy = true;
      this.clearHint(); this.select(-1); this.clearBubble();
      Sound.lose();
      const price = CONTINUE_PRICES[Math.min(this.continues, CONTINUE_PRICES.length - 1)];
      const snap = this.g.snapshot();
      const prog = snap.goals.reduce((a, g) => a + Math.min(1, g.got / g.n), 0) / snap.goals.length;
      const rem = snap.goals.filter(g => g.got < g.n).map(g => '<div class="goal" aria-label="' + esc(goalText({ kind: g.kind, t: g.t, n: g.n - g.got }, this.L)) + '"><span class="gi">' + ico(this.goalIcon(g)) + '</span><span class="n">' + (g.n - g.got) + '</span></div>').join('');
      const m = openModal({
        html: '<div class="ribbon-h">Out of moves</div><h2>' + (prog >= 0.7 ? 'You are so close!' : 'Want to keep going?') + '</h2>' +
          '<p class="lead" style="text-align:center">You still need:</p><div class="remaining">' + rem + '</div>' +
          '<div class="actions"><button class="btn btn-green btn-xl btn-stack" data-act="more">Add 5 moves<small>for ' + ico('i-coin') + fmt(price) + ' coins</small></button>' +
          '<div class="coins-have">You have ' + ico('i-coin') + ' ' + fmt(S.coins) + ' coins</div>' +
          '<button class="btn btn-ghost" data-act="end">No thanks, end the level</button></div>',
        actions: {
          more: async (t, mm) => {
            if (S.coins < price) {
              mm.close();
              openCoinShop('You need ' + fmt(price - S.coins) + ' more coins to add 5 moves.', () => { if (this.g && this.g.state === 'lost' && !modalOpen()) this.outOfMoves(); });
              return;
            }
            spendCoins(price);
            this.continues++;
            mm.close();
            const ph = this.g.addMoves(5);
            this.lowWarned = true;
            this.hud(this.g.snapshot());
            toast('5 more moves. You can do it!');
            if (ph && ph.length) await this.play(ph);
            this.busy = false;
            this.armHint();
          },
          end: (t, mm) => { mm.close(); this.fail(); }
        }
      });
      return m;
    },
    fail() {
      loseLife();
      const id = this.L.id;
      const line = unlimited() ? 'You have unlimited lives right now, so try again as often as you like.' : 'This used 1 life. You have ' + S.lives + ' ' + (S.lives === 1 ? 'life' : 'lives') + ' left.';
      openModal({
        html: '<div class="ribbon-h">Level ' + id + '</div>' + ico('i-heart', 'big-ico heart-ico') + '<h2>Not this time</h2><p class="lead" style="text-align:center">' + line + '</p>' +
          '<div class="actions"><button class="btn btn-red btn-xl" data-act="retry">' + ico('i-restart') + 'Try again</button><button class="btn btn-ghost" data-act="map">Back to the map</button></div>',
        actions: {
          retry: (t, m) => { m.close(); tryStart(id); },
          map: (t, m) => { m.close(); goMap(); }
        }
      });
    },
    pause() {
      if (!this.g || this.busy) return;
      this.clearHint();
      const used = this.g.movesUsed > 0 && this.g.state === 'play';
      const soundBtn = () => ico(S.settings.sound ? 'i-sound' : 'i-mute') + 'Sound effects: ' + (S.settings.sound ? 'On' : 'Off');
      openModal({
        html: '<div class="ribbon-h">Paused</div><h2>' + esc(this.L.title) + '</h2>' +
          '<div class="actions"><button class="btn btn-red btn-xl" data-act="resume">' + ico('i-play') + 'Keep playing</button>' +
          '<button class="btn btn-ghost" data-act="help">' + ico('i-help') + 'How to play</button>' +
          '<button class="btn btn-ghost" data-act="sound">' + soundBtn() + '</button>' +
          '<button class="btn btn-ghost" data-act="restart">' + ico('i-restart') + 'Start the level over</button>' +
          '<button class="btn btn-ghost" data-act="quit">' + ico('i-exit') + 'Leave the level</button></div>' +
          (used && !unlimited() ? '<p class="goal-moves">Starting over or leaving now uses 1 life.</p>' : ''),
        dismiss: true,
        onClose: () => this.armHint(),
        actions: {
          resume: (t, m) => m.close(),
          help: () => openHelp(),
          sound: t => { S.settings.sound = !S.settings.sound; save(); t.innerHTML = soundBtn(); },
          restart: (t, m) => { m.close(); if (used) loseLife(); tryStart(this.L.id); },
          quit: (t, m) => { m.close(); if (used) loseLife(); goMap(); }
        }
      });
    }
  };

  /* ==========================================================
     Buttons anywhere on the page
     ========================================================== */
  const ACTIONS = {
    enter: () => {
      showScreen('main');
      showTab('map');
      if (!completedCount() && !S.seen.intro) setTimeout(() => openIntro(1), 250);
      else if (dailyAvailable() && completedCount() > 0) setTimeout(openDaily, 350);
    },
    tab: t => showTab(t.dataset.tab),
    'goto-store': () => showTab('store'),
    lives: () => openLives(),
    stop: t => {
      const id = +t.dataset.id;
      if (!isUnlocked(id)) { toast('Win Level ' + (id - 1) + ' first to open this one.'); return; }
      openIntro(id);
    },
    daily: () => openDaily(),
    finale: () => openFinale(),
    buy: t => buy(t.dataset.sku, t),
    'buy-booster': t => buyBoosterWithCoins(t.dataset.b, +t.dataset.q),
    refill: () => {
      if (S.lives >= MAX_LIVES) return;
      if (!spendCoins(REFILL_PRICE)) { openCoinShop('You need ' + fmt(REFILL_PRICE - S.coins) + ' more coins to refill your lives.', null); return; }
      refillLives(); toast('Lives refilled!'); renderStore();
    },
    video: () => openVideo(),
    restore: async () => {
      const owned = await Payments.restore();
      toast(owned.length ? 'Restored: ' + owned.map(p => BY_SKU[p.sku].name).join(', ') + '.' : 'Nothing to restore in this demo.');
    },
    'pass-cancel': async () => {
      const ok = await confirmBox('Cancel Patriot Pass?', 'Your bonus coins and faster lives will stop. This is a demo, so nothing is billed either way.', 'Cancel the pass', 'Keep it');
      if (ok) { S.pass.active = false; save(); renderStore(); toast('Patriot Pass canceled.'); }
    },
    read: t => speakLevel(+t.dataset.id),
    'set-toggle': t => {
      const k = t.dataset.key;
      S.settings[k] = !S.settings[k];
      save();
      t.setAttribute('aria-checked', String(!!S.settings[k]));
      if (k === 'hints' && !S.settings.hints) Play.clearHint();
    },
    'set-seg': t => {
      S.settings[t.dataset.key] = t.dataset.val;
      save();
      applySettings();
      renderSettings();
    },
    help: () => openHelp(),
    reset: async () => {
      const ok = await confirmBox('Start the game over?', 'This clears your stars, coins, and boosters on this device.', 'Yes, start over', 'Keep my progress');
      if (!ok) return;
      S = defaults(); save(); applySettings();
      renderTitle(); showScreen('title');
      toast('The game has been reset.');
    },
    pause: () => Play.pause(),
    booster: t => Play.onBooster(t.dataset.b)
  };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-action]');
    if (!t || t.disabled) return;
    const fn = ACTIONS[t.dataset.action];
    if (!fn) return;
    Sound.unlock();
    if (t.dataset.action !== 'booster' && t.dataset.action !== 'enter') Sound.click();
    fn(t, e);
  });

  function renderTitle() {
    $('#title-flag').innerHTML = flagSVG(completedCount());
    const n = completedCount();
    $('#title-progress').textContent = n ? n + ' of 13 stars sewn on the flag' : 'Thirteen levels of American history';
  }

  /* ==========================================================
     Start up
     ========================================================== */
  function start(data) {
    load(data);
    tickLives();
    applySettings();
    $('#bunting').innerHTML = buntingSVG();
    $('#seal-svg').innerHTML = sealSVG();
    renderTitle();
    Play.init();
    showScreen('title');
    setInterval(() => { if (!$('#scr-main').hidden) renderTop(); }, 1000);
    window.addEventListener('resize', () => { if (!$('#scr-main').hidden && tab === 'map') drawRoad(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) save(); });
  }

  const hot = window.claude && window.claude.hot;
  if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ save: S })); } catch (e) { /* ignore */ } }
  if (hot && typeof hot.ready === 'function') hot.ready(start);
  else start((hot && hot.data) || {});

  window.LibertyMatch = { Play: Play, state: () => S };
})();
</script>

</body></html>
